[workspace]
resolver = "3"
members = [
    "crates/sito",
    "crates/sito-core",
    "crates/sito-proto",
    "crates/sito-transport",
    "crates/sito-upstream",
    "crates/sito-cache",
    "crates/sito-filter",
    "crates/sito-dnssec",
    "crates/sito-clients",
    "crates/sito-rewrites",
    "crates/sito-api",
    "crates/sito-stats",
    "crates/sito-ha",
    "crates/sito-test",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "GPL-3.0-only"
authors = ["sito contributors"]
repository = "https://github.com/kubaeror/sito-dns"
homepage = "https://github.com/kubaeror/sito-dns"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.43", features = ["full"] }
hickory-proto = { version = "0.26.2", default-features = false, features = ["std"] }
arc-swap = "1.7"
dashmap = "6.1"
moka = { version = "0.12", features = ["future"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
fnv = "1.0"
socket2 = "0.5"
libc = "0.2"
rustls = { version = "0.23", features = ["ring"] }
time = "0.3"
webpki-roots = "1.0"
tokio-rustls = "0.26"
rand = "0.8"
idna = "1.0"
async-trait = "0.1"
aho-corasick = "1.1"
regex-automata = { version = "0.4", features = ["dfa-build", "syntax", "hybrid"] }
criterion = "0.5"
rustls-pki-types = { version = "1.15", features = ["std"] }
rcgen = "0.14"
base64 = "0.22"
notify = "8.0"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio", "matched-path", "query", "ws"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "http1", "http2", "service"] }
x509-parser = "0.18"

# Internal workspace dependencies
sito = { path = "crates/sito", version = "0.1.0" }
sito-core = { path = "crates/sito-core", version = "0.1.0" }
sito-proto = { path = "crates/sito-proto", version = "0.1.0" }
sito-transport = { path = "crates/sito-transport", version = "0.1.0" }
sito-upstream = { path = "crates/sito-upstream", version = "0.1.0" }
sito-cache = { path = "crates/sito-cache", version = "0.1.0" }
sito-filter = { path = "crates/sito-filter", version = "0.1.0" }
sito-dnssec = { path = "crates/sito-dnssec", version = "0.1.0" }
sito-clients = { path = "crates/sito-clients", version = "0.1.0" }
sito-rewrites = { path = "crates/sito-rewrites", version = "0.1.0" }
sito-api = { path = "crates/sito-api", version = "0.1.0" }
sito-stats = { path = "crates/sito-stats", version = "0.1.0" }
sito-ha = { path = "crates/sito-ha", version = "0.1.0" }
sito-test = { path = "crates/sito-test", version = "0.1.0" }

[workspace.lints.rust]
# Future Rust lints can be specified here

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Allowlist of pedantic lints that are too noisy or unidiomatic for DNS systems
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
similar_names = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
default_trait_access = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
