[workspace]
resolver = "3"
members = [
    "crates/sito",
    "crates/sito-core",
    "crates/sito-proto",
    "crates/sito-transport",
    "crates/sito-upstream",
    "crates/sito-cache",
    "crates/sito-filter",
    "crates/sito-dnssec",
    "crates/sito-clients",
    "crates/sito-rewrites",
    "crates/sito-api",
    "crates/sito-stats",
    "crates/sito-ha",
    "crates/sito-test",
    "crates/sito-test-support",
    "crates/sito-runtime",
]
# Vendored as a path dependency below, not a workspace member.
exclude = ["vendor/sqlx-sqlite"]

[workspace.package]
version = "1.9.3"
edition = "2024"
rust-version = "1.99.1"
license = "GPL-3.0-only"
authors = ["sito contributors"]
repository = "https://github.com/kubaeror/sito-dns"
homepage = "https://github.com/kubaeror/sito-dns"

[workspace.dependencies]
askama = "0.16"
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1.54", features = ["full"] }
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
arc-swap = "1.9"
dashmap = "6.2"
moka = { version = "0.12", features = ["future"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
fnv = "1.0"
socket2 = "0.6"
libc = "0.2"
rustls = { version = "0.23", features = ["ring"] }
time = "0.3"
webpki-roots = "1.0"
tokio-rustls = "0.26"
rand = "0.10"
idna = "1.1"
async-trait = "0.1"
aho-corasick = "1.1"
regex-automata = { version = "0.4", features = ["dfa-build", "syntax", "hybrid"] }
criterion = "0.8"
rustls-pki-types = { version = "1.15", features = ["std"] }
rcgen = { version = "0.14", features = ["x509-parser"] }
base64 = "0.23"
notify = "8.2"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio", "matched-path", "query", "ws", "form", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hex = "0.4"
hyper = { version = "1.12", features = ["full"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "http1", "http2", "service"] }
x509-parser = "0.18"
rust-embed = "8.13"
mime_guess = "2.0"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
bytes = "1.12"
http = "1.5"
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls"] }
ring = "0.17"
blake3 = "1.8"
tokio-tungstenite = "0.30"
futures-util = "0.3"
subtle = "2.6"
mimalloc = { version = "0.1", default-features = false }
flate2 = "1.1"
tar = "0.4"
utoipa = { version = "6.0", features = ["axum_extras"] }

# Internal workspace dependencies
sito = { path = "crates/sito", version = "1.9.3" }
sito-core = { path = "crates/sito-core", version = "1.9.3" }
sito-proto = { path = "crates/sito-proto", version = "1.9.3" }
sito-transport = { path = "crates/sito-transport", version = "1.9.3" }
sito-upstream = { path = "crates/sito-upstream", version = "1.9.3" }
sito-cache = { path = "crates/sito-cache", version = "1.9.3" }
sito-filter = { path = "crates/sito-filter", version = "1.9.3" }
sito-dnssec = { path = "crates/sito-dnssec", version = "1.9.3" }
sito-clients = { path = "crates/sito-clients", version = "1.9.3" }
sito-rewrites = { path = "crates/sito-rewrites", version = "1.9.3" }
sito-api = { path = "crates/sito-api", version = "1.9.3" }
sito-stats = { path = "crates/sito-stats", version = "1.9.3" }
sito-runtime = { path = "crates/sito-runtime", version = "1.9.3" }
sito-ha = { path = "crates/sito-ha", version = "1.9.3" }
sito-test = { path = "crates/sito-test", version = "1.9.3" }
sito-test-support = { path = "crates/sito-test-support", version = "1.9.3" }

# sqlx-sqlite 0.9.0 caps libsqlite3-sys at <0.38.0, which bundles SQLite
# < 3.54.0 (RUSTSEC-2026-0459). The vendored copy only widens that range to
# <0.40.0 so the patched bundled SQLite (0.39.1) can be selected. Remove this
# patch once upstream sqlx-sqlite accepts libsqlite3-sys 0.39.
[patch.crates-io]
sqlx-sqlite = { path = "vendor/sqlx-sqlite" }

[workspace.lints.rust]
# Future Rust lints can be specified here

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Allowlist of pedantic lints that are too noisy or unidiomatic for DNS systems
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
similar_names = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
default_trait_access = "allow"

# Keep development artifacts small: dependencies ship without debuginfo and
# workspace crates keep line tables only. Incremental state is disabled because
# repeated full-workspace/test builds accumulated hundreds of GB in target/.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
