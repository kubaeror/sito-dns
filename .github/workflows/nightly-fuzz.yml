name: Nightly Fuzzing

# This workflow was disabled manually after a long streak of `no such command:
# fuzz` failures. Editing this file does NOT clear that state. After this
# change lands on main, re-enable and smoke it on the current default branch:
#
#   gh workflow enable nightly-fuzz.yml
#   gh workflow run nightly-fuzz.yml --ref main -f duration_seconds=10
#   gh run view --json headSha,event,conclusion \
#     "$(gh run list --workflow nightly-fuzz.yml --limit 1 --json databaseId --jq '.[0].databaseId')"
#
# The scheduled run itself always checks out the default branch HEAD; confirm
# the reported headSha equals `git ls-remote origin refs/heads/main` before
# trusting a nightly result.

on:
  schedule:
    - cron: '0 2 * * *' # Daily at 02:00 UTC
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Fuzzing duration per target (seconds)'
        required: false
        default: '600'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: fuzzing only reads the repository contents.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release-tests:
    name: release-tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: nightly-release-tests

      - name: Run full test suite in release mode
        env:
          SITO_BENCH_TESTS: "1"
        run: cargo test --workspace --release --all-features

  perf:
    name: perf-benches
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: nightly-perf

      - name: Run criterion benchmarks
        run: cargo bench --workspace --all-features

      - name: Upload benchmark estimates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-estimates-${{ github.run_id }}
          path: target/criterion/**/new/estimates.json
          if-no-files-found: warn

  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The repository pins the stable toolchain in rust-toolchain.toml; that
    # file wins over `rustup default`, so the nightly toolchain must be forced
    # via RUSTUP_TOOLCHAIN for cargo-fuzz's `-Zsanitizer` flags.
    env:
      RUSTUP_TOOLCHAIN: nightly
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_abp_parser
          - fuzz_toml_config
          - fuzz_client_id
          - fuzz_dns_wire
          - fuzz_dnssec_response
          - fuzz_ha_bundle
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: fuzz-${{ matrix.target }}

      # Pin a released install-action commit, not the `cargo-fuzz` branch head:
      # SHA pins do not include the `default: cargo-fuzz` input that the
      # published `@cargo-fuzz` tag injects, so the tool must be named
      # explicitly. cargo-fuzz is not (or no longer) in install-action's
      # manifest, so use the source-install fallback for a deterministic
      # `cargo-fuzz@0.13.2` instead of an unverified prebuilt.
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-fuzz@0.13.2
          fallback: cargo-install

      # Fail before the fuzz run if the install action silently did nothing
      # (the previous 57 failures were `error: no such command: fuzz`).
      - name: Verify cargo-fuzz is available
        run: cargo fuzz --version

      # Persist the per-target corpus across nightly runs: coverage-guided
      # fuzzing only converges when it can build on the inputs found by
      # previous runs. Each run saves a new cache entry (keyed by commit) and
      # restores the most recent corpus for the target on a miss.
      - name: Restore fuzz corpus for ${{ matrix.target }}
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Run fuzzer on ${{ matrix.target }}
        env:
          # Untrusted workflow_dispatch input is passed via env, never
          # interpolated directly into the shell.
          FUZZ_DURATION: ${{ github.event.inputs.duration_seconds || '600' }}
        run: |
          DURATION="${FUZZ_DURATION}"
          echo "Starting fuzzing session for ${{ matrix.target }} (duration: ${DURATION}s)..."
          cargo fuzz run ${{ matrix.target }} -- -max_total_time="${DURATION}" -rss_limit_mb=2048

      - name: Upload artifacts on crash
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crash-reproducer-${{ matrix.target }}
          path: |
            fuzz/artifacts/${{ matrix.target }}/*
            fuzz/crash-*
