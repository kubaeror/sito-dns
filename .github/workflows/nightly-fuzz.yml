name: Nightly Fuzzing

on:
  schedule:
    - cron: '0 2 * * *' # Daily at 02:00 UTC
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Fuzzing duration per target (seconds)'
        required: false
        default: '600'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_abp_parser
          - fuzz_toml_config
          - fuzz_client_id
          - fuzz_dns_wire
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-${{ matrix.target }}

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@cargo-fuzz

      - name: Run fuzzer on ${{ matrix.target }}
        run: |
          DURATION="${{ github.event.inputs.duration_seconds || '600' }}"
          echo "Starting fuzzing session for ${{ matrix.target }} (duration: ${DURATION}s)..."
          cargo fuzz run ${{ matrix.target }} -- -max_total_time=${DURATION} -rss_limit_mb=2048

      - name: Upload artifacts on crash
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-reproducer-${{ matrix.target }}
          path: |
            fuzz/artifacts/${{ matrix.target }}/*
            fuzz/crash-*
