name: Security

on:
  push:
    # The release gate requires a green `cargo-deny` check on the tagged
    # commit, so every push to a release branch must run this workflow (a
    # path-filtered run could leave a release commit without the check).
    branches: [main, release/1.9.x]
  workflow_call:
  workflow_dispatch:

# Least privilege: cargo-deny only reads the dependency graph.
permissions:
  contents: read

# `github.workflow` separates a weekly `workflow_call` (named after the caller,
# "Weekly Quality") from a pull request or push run of this workflow, so the two
# do not cancel each other.
concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
