name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      full:
        description: Run every job regardless of changed paths
        type: boolean
        default: false

# Least privilege: CI only reads repository contents. The `changes`
# classifier additionally reads the pull request file list.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Classifies the change set once so the expensive jobs can stay idle for
  # docs-only and container-only changes. On `push` to main only this job and
  # `ci-gate` run; branch protection requires `ci-gate`.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Reading the pull request file list is only needed by the path filter.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      config_docs: ${{ steps.filter.outputs.config_docs }}
      api: ${{ steps.filter.outputs.api }}
      contrib: ${{ steps.filter.outputs.contrib }}
      container: ${{ steps.filter.outputs.container }}
      deps: ${{ steps.filter.outputs.deps }}
      workflows: ${{ steps.filter.outputs.workflows }}
      force: ${{ steps.force.outputs.force }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
            docs:
              - 'docs/**'
              - '**/*.md'
              - 'LICENSE'
              - 'CODE_OF_CONDUCT.md'
              - 'SECURITY.md'
              - '.github/ISSUE_TEMPLATE/**'
              - '.github/PULL_REQUEST_TEMPLATE.md'
            config_docs:
              - 'docs/configuration-reference.md'
              - 'scripts/check_config_reference.py'
            api:
              - 'docs/openapi.json'
              - 'crates/sito-api/**'
            contrib:
              - 'contrib/**'
              - 'scripts/**'
            container:
              - 'Dockerfile'
              - 'Dockerfile.*'
              - '.dockerignore'
              - 'docker-compose*.yml'
              - 'config.example.toml'
              - 'contrib/systemd/**'
            deps:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - 'rust-toolchain.toml'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'

      # `ci:full` on a pull request or `full=true` on workflow_dispatch runs
      # every heavy lane even when no matching path changed.
      - name: Resolve the full-run override
        id: force
        env:
          FULL_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.full || false }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          if [ "${FULL_INPUT}" = "true" ] || [ "${FULL_LABEL}" = "true" ]; then
            echo "force=true" >> "$GITHUB_OUTPUT"
          else
            echo "force=false" >> "$GITHUB_OUTPUT"
          fi

  fmt:
    name: fmt
    needs: changes
    if: (needs.changes.outputs.code == 'true' || needs.changes.outputs.force == 'true') && (github.event_name != 'push' || github.ref != 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.99.1
          components: rustfmt
      - name: Check code formatting
        run: cargo fmt --check

  clippy:
    name: clippy
    needs: changes
    if: (needs.changes.outputs.code == 'true' || needs.changes.outputs.force == 'true') && (github.event_name != 'push' || github.ref != 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    needs: changes
    if: (needs.changes.outputs.code == 'true' || needs.changes.outputs.force == 'true') && (github.event_name != 'push' || github.ref != 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run tests
        env:
          # The OpenAPI export test writes docs/openapi.json only when this is
          # set; the diff below then verifies the committed spec is current.
          SITO_UPDATE_OPENAPI: "1"
        run: cargo test --workspace --all-features --locked
      - name: Verify docs/openapi.json is up to date
        run: git diff --exit-code docs/openapi.json
      - name: Verify configuration reference matches the config structs
        run: python3 scripts/check_config_reference.py --github

  openapi:
    name: openapi
    needs: changes
    # Only needed when the spec changed without touching crate code; crate
    # changes are already covered by the `test` job. `force` keeps `ci:full`
    # and `full=true` able to run every lane.
    if: ((needs.changes.outputs.api == 'true' && needs.changes.outputs.code == 'false') || needs.changes.outputs.force == 'true') && (github.event_name != 'push' || github.ref != 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Regenerate the OpenAPI specification
        run: SITO_UPDATE_OPENAPI=1 cargo test -p sito-api test_export_openapi_json
      - name: Verify docs/openapi.json is up to date
        run: git diff --exit-code docs/openapi.json

  contrib:
    name: contrib
    needs: changes
    if: (needs.changes.outputs.contrib == 'true' || needs.changes.outputs.force == 'true') && (github.event_name != 'push' || github.ref != 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run shellcheck
        run: |
          command -v shellcheck >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y shellcheck)
          shellcheck -S warning contrib/install.sh
      - name: Test AdGuard converter against the fixture
        run: |
          python3 -c "import yaml" >/dev/null 2>&1 || python3 -m pip install --quiet --break-system-packages pyyaml
          python3 contrib/tests/test_adguard_to_sito.py
      - name: Test release verification helpers
        run: |
          bash scripts/test-check-release-platforms.sh
          bash scripts/test-release-attestation-gate.sh

  build:
    name: build (${{ matrix.target }})
    needs: changes
    if: (needs.changes.outputs.code == 'true' || needs.changes.outputs.force == 'true') && (github.event_name != 'push' || github.ref != 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            use_cross: true
          - target: armv7-unknown-linux-gnueabihf
            use_cross: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cross
      - name: Build binary for ${{ matrix.target }}
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --workspace --features embed-ui --locked --target ${{ matrix.target }}
          else
            cargo build --workspace --all-features --locked --target ${{ matrix.target }}
          fi
      - name: Verify binary output
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: ./target/${{ matrix.target }}/debug/sito --version

  # Single required check. Skipped jobs (docs-only, container-only or a push
  # to main) count as success; a failed or cancelled job fails the gate.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [changes, fmt, clippy, test, build, openapi, contrib]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if a required job failed
        run: |
          for r in ${{ join(needs.*.result, ' ') }}; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              exit 1
            fi
          done
