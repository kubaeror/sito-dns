name: CI

on:
  push:
    # Release branches are tested too: the release gate refuses to publish a
    # tag unless its commit has a green `ci-gate` check run.
    branches: [main, release/1.9.x]
  pull_request:
    branches: [main, release/1.9.x]
  merge_group:
  workflow_dispatch:
    inputs:
      full:
        description: Run every job regardless of changed paths
        type: boolean
        default: false

# Least privilege: CI only reads repository contents. The `changes`
# classifier additionally reads the pull request file list.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Classifies the change set once so the expensive jobs can stay idle for
  # docs-only and container-only changes. A push to `main` runs the same
  # path-filtered heavy jobs as a pull request; branch protection requires
  # `ci-gate`.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Reading the pull request file list is only needed by the path filter.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      config_docs: ${{ steps.filter.outputs.config_docs }}
      api: ${{ steps.filter.outputs.api }}
      contrib: ${{ steps.filter.outputs.contrib }}
      container: ${{ steps.filter.outputs.container }}
      deps: ${{ steps.filter.outputs.deps }}
      fuzz: ${{ steps.filter.outputs.fuzz }}
      workflows: ${{ steps.filter.outputs.workflows }}
      force: ${{ steps.force.outputs.force }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              # Structural budgets are code checks even though the scripts and
              # exception list are not Rust sources.
              - 'scripts/check-file-size.sh'
              - 'scripts/check-function-size.sh'
              - 'scripts/rust_size.py'
              - 'scripts/test_rust_size.py'
              - 'scripts/fixtures/rust-size/**'
              - 'scripts/check-fuzz-targets.py'
              - 'scripts/test_check_fuzz_targets.py'
              - 'scripts/check-bench-regression.py'
              - 'scripts/check_bench_regression.py'
              - 'scripts/test_check_bench_regression.py'
              - 'scripts/save-bench-baseline.sh'
              - 'benches/**'
              - 'fuzz/Cargo.toml'
              - 'fuzz/fuzz_targets/**'
              - 'fuzz/corpus/**'
              - 'fuzz/dictionaries/**'
              - 'fuzz/.gitignore'
              - 'fuzz/README.md'
              - 'docs/large-functions.md'
            docs:
              - 'docs/**'
              - '**/*.md'
              - 'LICENSE'
              - 'CODE_OF_CONDUCT.md'
              - 'SECURITY.md'
              - '.github/ISSUE_TEMPLATE/**'
              - '.github/PULL_REQUEST_TEMPLATE.md'
            config_docs:
              - 'docs/configuration-reference.md'
              - 'scripts/check_config_reference.py'
              - 'scripts/check_markdown_links.py'
            api:
              - 'docs/openapi.json'
              - 'crates/sito-api/**'
            contrib:
              - 'contrib/**'
              - 'scripts/**'
            container:
              - 'Dockerfile'
              - 'Dockerfile.*'
              - '.dockerignore'
              - 'docker-compose*.yml'
              - 'config.example.toml'
              - 'contrib/systemd/**'
            deps:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - 'rust-toolchain.toml'
            fuzz:
              - 'fuzz/**'
              - 'scripts/check-fuzz-targets.py'
              - 'scripts/test_check_fuzz_targets.py'
              - '.github/workflows/fuzz.yml'
            workflows:
              - '.github/workflows/**'

      # `ci:full` on a pull request or `full=true` on workflow_dispatch runs
      # every heavy lane even when no matching path changed.
      - name: Resolve the full-run override
        id: force
        env:
          FULL_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.full || false }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          if [ "${FULL_INPUT}" = "true" ] || [ "${FULL_LABEL}" = "true" ]; then
            echo "force=true" >> "$GITHUB_OUTPUT"
          else
            echo "force=false" >> "$GITHUB_OUTPUT"
          fi

  fmt:
    name: fmt
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.force == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.99.1
          components: rustfmt
      - name: Check code formatting
        run: cargo fmt --all --check

  clippy:
    name: clippy
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.force == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.force == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run tests
        env:
          # The OpenAPI export test writes docs/openapi.json only when this is
          # set; the diff below then verifies the committed spec is current.
          SITO_UPDATE_OPENAPI: "1"
        run: cargo test --workspace --all-features --locked
      - name: Verify docs/openapi.json is up to date
        run: git diff --exit-code docs/openapi.json
      - name: Verify configuration reference matches the config structs
        run: python3 scripts/check_config_reference.py --github
      - name: Verify best-effort error swallowing is reviewed
        run: bash scripts/check-error-swallowing.sh
      - name: Verify production module and function size budgets
        run: |
          bash scripts/check-file-size.sh
          bash scripts/check-function-size.sh
      - name: Test the structural size checker
        run: python3 scripts/test_rust_size.py
      - name: Verify the fuzz workspace, corpus and gitignore rules
        run: |
          python3 scripts/check-fuzz-targets.py
          python3 scripts/test_check_fuzz_targets.py
      - name: Test the benchmark regression gate
        run: python3 scripts/test_check_bench_regression.py

  # Fast structural gates added by WP-1.9. They do not run the long fuzz or
  # benchmark workloads; `fuzz.yml` and `bench.yml` own the nightly/release
  # runs.
  bench-build:
    name: bench-build
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.force == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: bench-build
      - name: Compile every Criterion benchmark
        run: cargo bench --workspace --all-features --locked --no-run

  fuzz-build:
    name: fuzz-build
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.fuzz == 'true' || needs.changes.outputs.force == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cargo-fuzz needs a nightly compiler. Pin the date so a nightly change
      # cannot silently break the build between the PR and the nightly run.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: nightly-2026-11-04
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: fuzz-build
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-fuzz@0.13.2
      - name: Build every fuzz target
        run: cargo +nightly-2026-11-04 fuzz build
      - name: Check fuzz target formatting
        run: cargo +nightly-2026-11-04 fmt --manifest-path fuzz/Cargo.toml --check

  hygiene:
    name: hygiene
    needs: changes
    # Dependency drift can appear with either Cargo.lock or source changes.
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.force == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.99.1
      - name: Install the nightly toolchain used by cargo-udeps
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: nightly-2026-11-04
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: hygiene
      - name: Install cargo-machete and cargo-udeps
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-machete@0.9.2,cargo-udeps@0.1.61
      - name: Check for unused dependencies (Cargo.toml)
        run: cargo machete
      - name: Check for unused dependencies (compiled targets)
        run: cargo +nightly-2026-11-04 udeps --workspace --all-targets

  coverage:
    name: coverage
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.force == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # Floor is deliberately a little below the measured workspace coverage
      # (88.2% lines on the WP-1.9 host) so ordinary platform differences do
      # not flake, while a real coverage regression still fails. Raise it via
      # the repository variable as coverage improves.
      MIN_LINE_COVERAGE: ${{ vars.MIN_LINE_COVERAGE || '85' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.99.1
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: coverage
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Measure line coverage
        run: |
          set -o pipefail
          cargo llvm-cov --workspace --all-features --locked \
            --summary-only \
            --fail-under-lines "${MIN_LINE_COVERAGE}" \
            | tee target/llvm-cov-summary.txt
      - name: Generate the LCOV report
        run: cargo llvm-cov report --lcov --output-path target/lcov.info
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.run_id }}
          path: |
            target/lcov.info
            target/llvm-cov-summary.txt
          if-no-files-found: warn

  openapi:
    name: openapi
    needs: changes
    # Only needed when the spec changed without touching crate code; crate
    # changes are already covered by the `test` job. `force` keeps `ci:full`
    # and `full=true` able to run every lane.
    if: ((needs.changes.outputs.api == 'true' && needs.changes.outputs.code == 'false') || needs.changes.outputs.force == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Regenerate the OpenAPI specification
        run: SITO_UPDATE_OPENAPI=1 cargo test -p sito-api test_export_openapi_json
      - name: Verify docs/openapi.json is up to date
        run: git diff --exit-code docs/openapi.json

  contrib:
    name: contrib
    needs: changes
    # `workflows` is included so the release-workflow policy test also runs
    # when only .github/workflows/** changes.
    if: (needs.changes.outputs.contrib == 'true' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.force == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run shellcheck
        run: |
          command -v shellcheck >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y shellcheck)
          shellcheck -S warning \
            contrib/install.sh \
            contrib/tests/test-installer.sh \
            scripts/verify-release-gate.sh \
            scripts/test-verify-release-gate.sh \
            scripts/test-release-workflow.sh \
            scripts/test-sqlite-advisory-pin.sh \
            scripts/save-bench-baseline.sh
      - name: Test AdGuard converter against the fixture
        run: |
          python3 -c "import yaml" >/dev/null 2>&1 || python3 -m pip install --quiet --break-system-packages pyyaml
          python3 contrib/tests/test_adguard_to_sito.py
      - name: Test the installer end to end
        run: bash contrib/tests/test-installer.sh
      - name: Test release verification helpers
        run: |
          bash scripts/test-check-release-platforms.sh
          bash scripts/test-release-attestation-gate.sh
          bash scripts/test-verify-release-gate.sh
          bash scripts/test-release-workflow.sh
          bash scripts/test-sqlite-advisory-pin.sh
      - name: Compile the CI usage helper
        run: python3 -m py_compile scripts/ci_usage.py

  docs-check:
    name: docs-check
    needs: changes
    if: (needs.changes.outputs.docs == 'true' || needs.changes.outputs.config_docs == 'true' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.force == 'true')
    permissions:
      contents: read
    uses: ./.github/workflows/docs.yml

  container-check:
    name: container-check
    needs: changes
    if: (needs.changes.outputs.container == 'true' || needs.changes.outputs.force == 'true')
    permissions:
      contents: read
    uses: ./.github/workflows/container.yml

  security-check:
    name: security-check
    needs: changes
    # On pushes, security.yml runs from its own push trigger (unfiltered) so
    # every release-branch commit has a `cargo-deny` check run for the release
    # gate. On every pull request and merge group the reusable call runs,
    # independent of the dependency path filter: a new advisory can affect a
    # dependency set that the code change did not touch (P3-18).
    if: github.event_name != 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/security.yml

  build:
    name: build (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.force == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            use_cross: true
          - target: armv7-unknown-linux-gnueabihf
            use_cross: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cross
      - name: Build binary for ${{ matrix.target }}
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --workspace --features embed-ui --locked --target ${{ matrix.target }}
          else
            cargo build --workspace --all-features --locked --target ${{ matrix.target }}
          fi
      - name: Verify binary output
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: ./target/${{ matrix.target }}/debug/sito --version

  # Single required check. Skipped jobs (irrelevant paths) count as success;
  # a failed or cancelled job fails the gate.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [changes, fmt, clippy, test, build, openapi, contrib, docs-check, container-check, security-check, bench-build, fuzz-build, hygiene, coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if a required job failed
        run: |
          for r in ${{ join(needs.*.result, ' ') }}; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              exit 1
            fi
          done
