name: Artifact E2E

# Verifies a staged release end to end: the unified checksum file, the cosign
# keyless signature identity, and that every packaged binary accepts the
# configuration shipped inside its archive.
#
# - `workflow_call`: invoked by release.yml while the release is still a draft,
#   before publish-release flips it public. It is a job in that workflow rather
#   than a `release: published` trigger because GitHub does not start workflows
#   for releases created with the repository's GITHUB_TOKEN.
# - `workflow_dispatch`: re-verify any existing release without publishing.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to verify (for example v1.9.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify (for example v1.9.0, or "latest")
        required: true
        type: string
        default: latest

# Reads the staged release assets and metadata. The release workflow stages a
# draft first, and draft releases are only visible to tokens with write access,
# so `gh release download` requires contents: write. The job only downloads.
permissions:
  contents: write

jobs:
  artifact-e2e:
    name: verify (${{ inputs.tag }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGETS: |
        x86_64-unknown-linux-gnu
        aarch64-unknown-linux-gnu
        armv7-unknown-linux-gnueabihf
      # Same runtime base as Dockerfile.release: the archive must run there.
      # Checked against Dockerfile.release below so the two cannot drift.
      RUNTIME_IMAGE: gcr.io/distroless/cc-debian13:nonroot@sha256:08476c244888bfb425bae1ae4dd7c17f093e972aab8426883d97f3c6f280f7c1
    steps:
      - name: Resolve the release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${REQUESTED_TAG}" = "latest" ]; then
            tag="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)"
          else
            tag="${REQUESTED_TAG}"
          fi
          # The tag is interpolated into asset paths and a grep pattern below.
          if ! printf '%s' "${tag}" | grep -Eq '^v[0-9][0-9A-Za-z.+-]*$'; then
            echo "::error::unexpected release tag '${tag}'"
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      # Check out the resolved tag, not the branch selected in the dispatch UI,
      # so the Dockerfile.release / runtime-image check below reads the code
      # that actually produced the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 1

      - name: Verify the runtime image matches Dockerfile.release
        run: |
          set -euo pipefail
          if [ ! -f Dockerfile.release ]; then
            echo "::error::Dockerfile.release is missing"
            exit 1
          fi
          # Anchor to a real `FROM` line carrying a full digest so a commented
          # or unrelated reference cannot satisfy the check.
          if ! grep -Eq '^FROM gcr\.io/distroless/cc-debian13:nonroot@sha256:[0-9a-f]{64}$' Dockerfile.release; then
            echo "::error::Dockerfile.release has no pinned distroless runtime FROM line"
            exit 1
          fi
          if ! grep -Fxq "FROM ${RUNTIME_IMAGE}" Dockerfile.release; then
            echo "::error::RUNTIME_IMAGE ${RUNTIME_IMAGE} does not match Dockerfile.release"
            exit 1
          fi
          echo "RUNTIME_IMAGE matches Dockerfile.release"

      - name: Download the release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir release-assets \
            --pattern 'sito-*.tar.gz' \
            --pattern 'sito-*.tar.gz.sha256' \
            --pattern 'sito-*.tar.gz.sig' \
            --pattern 'sito-*.tar.gz.pem' \
            --pattern 'SHA256SUMS'
          ls -l release-assets

      - name: Verify checksums
        working-directory: release-assets
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          while IFS= read -r triple; do
            [ -n "${triple}" ] || continue
            archive="sito-${TAG}-${triple}.tar.gz"
            if [ ! -f "${archive}" ]; then
              echo "::error::missing release archive ${archive}"
              exit 1
            fi
            sha256sum -c "${archive}.sha256"
            # SHA256SUMS also covers the SBOM, which this job does not
            # download; verify only the archive under test.
            grep -F "  ${archive}" SHA256SUMS | sha256sum -c -
          done <<< "${TARGETS}"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          # Pinned to v2 like release.yml: the v3 CLI changed its flag surface.
          cosign-release: 'v2.6.5'

      - name: Verify the cosign keyless signatures
        working-directory: release-assets
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          while IFS= read -r triple; do
            [ -n "${triple}" ] || continue
            archive="sito-${TAG}-${triple}.tar.gz"
            cosign verify-blob \
              --certificate "${archive}.pem" \
              --signature "${archive}.sig" \
              --certificate-identity-regexp \
                '^https://github.com/kubaeror/sito-dns/\.github/workflows/release\.yml@refs/tags/.*$' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${archive}"
          done <<< "${TARGETS}"

      # The arm64 and armv7 archives are executed in containers for their own
      # platform. QEMU provides the CPU emulation; the distroless release base
      # image provides the matching glibc and dynamic loader.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64,arm

      - name: Extract and validate the shipped configuration
        working-directory: release-assets
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          while IFS= read -r triple; do
            [ -n "${triple}" ] || continue
            case "${triple}" in
              x86_64-*) platform="linux/amd64" ;;
              aarch64-*) platform="linux/arm64" ;;
              armv7-*) platform="linux/arm/v7" ;;
              *) echo "::error::unmapped target '${triple}'"; exit 1 ;;
            esac
            archive="sito-${TAG}-${triple}.tar.gz"
            dir="${archive%.tar.gz}"
            tar -xzf "${archive}"
            docker run --rm --platform "${platform}" \
              --entrypoint "/assets/${dir}/sito" \
              -v "${PWD}:/assets:ro" \
              "${RUNTIME_IMAGE}" --version
            docker run --rm --platform "${platform}" \
              --entrypoint "/assets/${dir}/sito" \
              -v "${PWD}:/assets:ro" \
              "${RUNTIME_IMAGE}" check-config --config "/assets/${dir}/config.example.toml"
            # Every platform uses the same digest-pinned image. The observed
            # failure is consistent with the runner's Docker store keeping a
            # single local reference per digest: without removing it, the next
            # --platform pull can fail with "cannot overwrite digest". Drop the
            # local image so the next platform can be pulled while
            # RUNTIME_IMAGE stays digest-pinned.
            if ! docker image rm "${RUNTIME_IMAGE}" >/dev/null 2>&1; then
              echo "::warning::could not remove ${RUNTIME_IMAGE}; the next --platform pull may fail with 'cannot overwrite digest'"
            fi
          done <<< "${TARGETS}"
