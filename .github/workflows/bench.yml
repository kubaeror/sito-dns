name: Bench

# Thresholded benchmark comparison. This is a nightly/manual gate, never a
# pull-request gate: the committed baseline stores absolute medians and is
# only meaningful on the runner class that produced it. Pull requests just
# compile the benches (`ci.yml` → `bench-build`).
#
# The committed baseline was generated on the WP-1.9 development host. The
# workflow refuses to run unless BENCH_RUNNER_LABEL names a dedicated runner
# and BENCH_ENVIRONMENT is set; the checker then fails on an environment
# mismatch. Provision the runner, regenerate the baseline there with
# `update_baseline=true`, and commit the artifact.
on:
  schedule:
    # Nightly, after the fuzz smoke starts.
    - cron: '42 5 * * *'
  workflow_dispatch:
    inputs:
      update_baseline:
        description: Write a new benches/baseline.json from this run (uploaded as an artifact)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Repository variable so operators can point the gate at a dedicated
  # self-hosted benchmark runner without editing this file. The baseline must
  # be generated on the same runner class.
  BENCH_ENVIRONMENT: ${{ vars.BENCH_ENVIRONMENT }}
  BENCH_TOLERANCE: ${{ vars.BENCH_TOLERANCE }}

jobs:
  bench:
    name: bench
    runs-on: ${{ vars.BENCH_RUNNER_LABEL || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The committed baseline is absolute and environment specific. Refuse to
      # present the comparison as meaningful on an unconfigured/default runner.
      - name: Require the dedicated benchmark runner
        env:
          RUNNER_LABEL: ${{ vars.BENCH_RUNNER_LABEL }}
          ENVIRONMENT: ${{ vars.BENCH_ENVIRONMENT }}
        run: |
          set -euo pipefail
          if [ -z "${RUNNER_LABEL}" ]; then
            echo "::error::BENCH_RUNNER_LABEL is not set; benchmark comparisons are only valid on the dedicated runner. Set the repository variable, or use workflow_dispatch input update_baseline after provisioning."
            exit 1
          fi
          case "${RUNNER_LABEL}" in
            ubuntu-*|windows-*|macos-*)
              echo "::error::BENCH_RUNNER_LABEL='${RUNNER_LABEL}' is a GitHub-hosted label; use a dedicated/self-hosted benchmark runner"
              exit 1
              ;;
          esac
          if [ -z "${ENVIRONMENT}" ]; then
            echo "::error::BENCH_ENVIRONMENT is not set; it must name the runner class recorded in benches/baseline.json"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: bench
      - name: Run Criterion benchmarks
        run: cargo bench --workspace --all-features --locked
      - name: Compare against the committed baseline (fails above the tolerance)
        if: ${{ !inputs.update_baseline }}
        env:
          CURRENT_ENVIRONMENT: ${{ vars.BENCH_ENVIRONMENT }}
        run: |
          set -o pipefail
          tolerance_args=()
          if [ -n "${BENCH_TOLERANCE:-}" ]; then
            tolerance_args=(--tolerance "${BENCH_TOLERANCE}")
          fi
          python3 scripts/check-bench-regression.py \
            --github \
            --environment "${CURRENT_ENVIRONMENT}" \
            "${tolerance_args[@]}" \
            | tee bench-comparison.txt
      - name: Save a new baseline
        if: ${{ inputs.update_baseline }}
        env:
          CURRENT_ENVIRONMENT: ${{ vars.BENCH_ENVIRONMENT }}
        run: |
          set -o pipefail
          python3 scripts/check-bench-regression.py \
            --save \
            --environment "${CURRENT_ENVIRONMENT}" \
            | tee bench-baseline.txt
      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ github.run_id }}
          path: |
            target/criterion/**/new/estimates.json
            benches/baseline.json
            bench-comparison.txt
            bench-baseline.txt
          if-no-files-found: warn
