name: Release

on:
  push:
    tags:
      - 'v*'

# Releases are published from tag pushes only. workflow_dispatch is
# deliberately not supported: GitHub mints the OIDC identity from the ref that
# triggered the run, so a dispatch run on a branch would sign with
# `...release.yml@refs/heads/<branch>` which neither contrib/install.sh nor
# crates/sito-api/src/updater.rs accepts (both pin `@refs/tags/.*`). Tag pushes
# sign with `...release.yml@refs/tags/<tag>` and verify end-to-end.
# The published assets are re-verified by artifact-e2e.yml, which can also be
# dispatched manually for an existing tag without publishing anything.

# Least privilege by default; jobs grant the narrow permissions they need.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-binaries:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            use_cross: false
            features: "embed-ui,mimalloc"
          - target: aarch64-unknown-linux-gnu
            use_cross: true
            features: "embed-ui,mimalloc"
          - target: armv7-unknown-linux-gnueabihf
            use_cross: true
            features: "embed-ui,mimalloc"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@1cfda69c3ffc46415a19b9f328807509e1b5c880 # cross

      - name: Build release binary for ${{ matrix.target }}
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }} -p sito --features "${{ matrix.features }}"
          else
            cargo build --release --locked --target ${{ matrix.target }} -p sito --features "${{ matrix.features }}"
          fi

      - name: Verify installer script with shellcheck
        run: |
          command -v shellcheck >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y shellcheck)
          shellcheck -S warning contrib/install.sh

      - name: Package release archive
        env:
          # The tag that triggered the run; the ref_name fallback was removed
          # together with workflow_dispatch publishing.
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG}"
          ARCHIVE_DIR="sito-${VERSION}-${{ matrix.target }}"
          mkdir -p "${ARCHIVE_DIR}"
          cp "target/${{ matrix.target }}/release/sito" "${ARCHIVE_DIR}/"
          cp LICENSE README.md config.example.toml "${ARCHIVE_DIR}/"
          mkdir -p "${ARCHIVE_DIR}/contrib/systemd"
          cp contrib/systemd/sito.service "${ARCHIVE_DIR}/contrib/systemd/"
          cp contrib/install.sh "${ARCHIVE_DIR}/"

          tar -czf "${ARCHIVE_DIR}.tar.gz" "${ARCHIVE_DIR}"
          sha256sum "${ARCHIVE_DIR}.tar.gz" > "${ARCHIVE_DIR}.tar.gz.sha256"

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            sito-*.tar.gz
            sito-*.tar.gz.sha256

  sbom-and-release:
    name: Generate SBOM & Publish Release
    needs: [build-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # create the GitHub release
      id-token: write # cosign keyless signing via GitHub OIDC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Download all binary artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Flatten artifacts and compute unified SHA256SUMS
        run: |
          mkdir -p release-assets
          # Publish the per-archive .sha256 files as documented, plus the
          # unified SHA256SUMS consumed by the installer.
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.tar.gz.sha256" \) -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum *.tar.gz > SHA256SUMS
          cd ..

      - name: Verify release tag matches the workspace version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "${RELEASE_TAG}" != "v${VERSION}" ]; then
            echo "::error::Release tag '${RELEASE_TAG}' does not match workspace version 'v${VERSION}'"
            exit 1
          fi

      - name: Install cargo-sbom
        uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2
        with:
          tool: cargo-sbom@0.10.0

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          # Pinned to a v2 release: the v3 CLI changed its flag surface.
          cosign-release: 'v2.6.5'

      - name: Generate SPDX SBOM
        run: |
          cargo sbom --output-format spdx_json_2_3 > release-assets/sito.spdx.json
          sha256sum release-assets/sito.spdx.json >> release-assets/SHA256SUMS

      - name: Sign release archives (cosign keyless)
        # Runs on tag pushes only (see the `on:` block): the signing identity
        # must stay `release.yml@refs/tags/*` so install.sh and the updater
        # can verify it.
        run: |
          cd release-assets
          for archive in *.tar.gz; do
            cosign sign-blob --yes \
              --output-signature "${archive}.sig" \
              --output-certificate "${archive}.pem" \
              "${archive}"
          done
          ls -la

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # Tag pushes only; ref_name is the tag that triggered the run.
          tag_name: ${{ github.ref_name }}
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false

  artifact-e2e:
    name: Verify release artifacts
    needs: [sbom-and-release]
    permissions:
      contents: read
    uses: ./.github/workflows/artifact-e2e.yml
    with:
      tag: ${{ github.ref_name }}

  docker-build-push:
    name: Build and Push Multi-Arch Container Image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write # push the image to GHCR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # No docker/setup-qemu-action: the Dockerfile builds on
      # --platform=$BUILDPLATFORM and cross-compiles, so no target-architecture
      # binaries are executed during the build.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Supply-chain attestations: BuildKit provenance and an SPDX SBOM
          # attestation are attached to the pushed image index. Verify with:
          #   docker buildx imagetools inspect <image>@<digest> --format '{{json .Provenance}}'
          #   cosign verify-attestation --type spdxjson <image>@<digest> ...
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
