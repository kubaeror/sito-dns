name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-publish
  cancel-in-progress: false

# Releases are published from tag pushes only. workflow_dispatch is
# deliberately not supported: GitHub mints the OIDC identity from the ref that
# triggered the run, so a dispatch run on a branch would sign with
# `...release.yml@refs/heads/<branch>` which neither contrib/install.sh nor
# crates/sito-api/src/updater.rs accepts (both pin `@refs/tags/.*`). Tag pushes
# sign with `...release.yml@refs/tags/<tag>` and verify end-to-end.
# Assets are staged as a draft GitHub release and published only after
# artifact-e2e.yml and the container image job both succeed, so an E2E or image
# failure cannot leave a published release without its image. artifact-e2e.yml
# can also be dispatched manually for an existing published tag without
# publishing anything.

# Least privilege by default; jobs grant the narrow permissions they need.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify-tag:
    name: Verify tag matches workspace version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every publishing job depends on this job, so a mismatched tag stops the
      # workflow before any binary, release asset or image is produced.
      - name: Verify release tag matches the workspace version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ -z "${VERSION}" ]; then
            echo "::error::could not read the workspace version from Cargo.toml"
            exit 1
          fi
          # Stable tag: v1.9.2. Prerelease tag: v1.9.2-rc.1 (any valid suffix
          # after the workspace version). Anything else is a mismatch.
          pattern="^v${VERSION//./\\.}(-[0-9A-Za-z][0-9A-Za-z.-]*)?$"
          if ! printf '%s\n' "${RELEASE_TAG}" | grep -Eq "${pattern}"; then
            echo "::error::Release tag '${RELEASE_TAG}' does not match workspace version 'v${VERSION}'"
            echo "::error::expected 'v${VERSION}' or a prerelease such as 'v${VERSION}-rc.1'"
            exit 1
          fi

  release-gate:
    name: Verify release branch and green checks
    needs: [verify-tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # `gh api` reads the check-run and commit-status records for the tagged
    # commit.  No write access is granted here.
    permissions:
      contents: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate needs the tag object and the release branch to run
          # `git merge-base --is-ancestor`.
          fetch-depth: 0
      - name: Verify the tag is on the required branch with green CI/security
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-release-gate.sh

  build-binaries:
    name: build (${{ matrix.target }})
    needs: [verify-tag, release-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            use_cross: false
            features: "embed-ui,ha,mimalloc"
          - target: aarch64-unknown-linux-gnu
            use_cross: true
            features: "embed-ui,ha,mimalloc"
          - target: armv7-unknown-linux-gnueabihf
            use_cross: true
            features: "embed-ui,ha,mimalloc"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cross

      - name: Build release binary for ${{ matrix.target }}
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }} -p sito --features "${{ matrix.features }}"
          else
            cargo build --release --locked --target ${{ matrix.target }} -p sito --features "${{ matrix.features }}"
          fi

      - name: Verify installer script with shellcheck
        run: |
          command -v shellcheck >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y shellcheck)
          shellcheck -S warning contrib/install.sh

      - name: Package release archive
        env:
          # The tag that triggered the run; the ref_name fallback was removed
          # together with workflow_dispatch publishing.
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG}"
          ARCHIVE_DIR="sito-${VERSION}-${{ matrix.target }}"
          mkdir -p "${ARCHIVE_DIR}"
          cp "target/${{ matrix.target }}/release/sito" "${ARCHIVE_DIR}/"
          cp LICENSE README.md config.example.toml "${ARCHIVE_DIR}/"
          mkdir -p "${ARCHIVE_DIR}/contrib/systemd"
          cp contrib/systemd/sito.service "${ARCHIVE_DIR}/contrib/systemd/"
          cp contrib/install.sh "${ARCHIVE_DIR}/contrib/"

          tar -czf "${ARCHIVE_DIR}.tar.gz" "${ARCHIVE_DIR}"
          sha256sum "${ARCHIVE_DIR}.tar.gz" > "${ARCHIVE_DIR}.tar.gz.sha256"

      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: |
            sito-*.tar.gz
            sito-*.tar.gz.sha256

  sbom-and-release:
    name: Generate SBOM & Stage Release
    needs: [verify-tag, release-gate, build-binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # create the GitHub release
      id-token: write # cosign keyless signing via GitHub OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.99.1

      - name: Download all binary artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Flatten artifacts and compute unified SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # Publish the per-archive .sha256 files as documented, plus the
          # unified SHA256SUMS consumed by the installer.
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.tar.gz.sha256" \) -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum -- *.tar.gz > SHA256SUMS
          cd ..

      # The tag/version gate runs in the verify-tag job that all publishing
      # jobs depend on, so no release asset is published for a mismatched tag.

      - name: Install cargo-sbom
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-sbom@0.10.0

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          # Pinned to a v2 release: the v3 CLI changed its flag surface.
          cosign-release: 'v2.6.5'

      - name: Generate SPDX SBOM
        run: |
          cargo sbom --output-format spdx_json_2_3 > release-assets/sito.spdx.json
          # Keep the unified checksum paths relative to the download directory so
          # `sha256sum -c SHA256SUMS` works for users who download every asset.
          (cd release-assets && sha256sum sito.spdx.json >> SHA256SUMS)

      - name: Sign release archives (cosign keyless)
        # Runs on tag pushes only (see the `on:` block): the signing identity
        # must stay `release.yml@refs/tags/*` so install.sh and the updater
        # can verify it.
        run: |
          cd release-assets
          for archive in *.tar.gz; do
            cosign sign-blob --yes \
              --output-signature "${archive}.sig" \
              --output-certificate "${archive}.pem" \
              "${archive}"
          done
          ls -la

      - name: Stage GitHub Release (draft)
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          # Tag pushes only; ref_name is the tag that triggered the run.
          tag_name: ${{ github.ref_name }}
          files: |
            release-assets/*
          generate_release_notes: true
          # Stage, do not publish: artifact-e2e and docker-build-push consume
          # this draft, and publish-release flips it only after both succeed.
          # A draft is not visible to anonymous users, so artifact-e2e runs with
          # contents: write to download its assets.
          draft: true
          # Tags containing '-' are prereleases and must never be published as
          # a stable release or move the repository's "latest" release. The
          # latest flag itself is applied by publish-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: 'false'
          body: |
            ## Container image

            The image is published only after the tag/version check, the
            release-branch/CI gate, the signed release assets, the SBOM, and
            the artifact E2E verification pass. It is then scanned for
            HIGH/CRITICAL vulnerabilities and its digest is signed with cosign
            keyless signing. Stable tags also update `latest`; prerelease tags
            (the tag contains `-`) never do.

            Verify the image (Docker tags omit the leading `v`):

            ```bash
            release_tag=${{ github.ref_name }}
            image="ghcr.io/${{ github.repository }}:${release_tag#v}"
            docker buildx imagetools inspect "$image" --format '{{json .Provenance}}'
            docker buildx imagetools inspect "$image" --format '{{json .SBOM}}'
            ```

            See `docs/release-verification.md` for the full post-push checklist
            and expected results.

  artifact-e2e:
    name: Verify release artifacts
    needs: [sbom-and-release]
    # The release is still a draft here, and drafts are only visible to tokens
    # with write access, so `gh release download` needs a write-capable token.
    permissions:
      contents: write
    uses: ./.github/workflows/artifact-e2e.yml
    with:
      tag: ${{ github.ref_name }}

  docker-build-push:
    name: Build and Push Multi-Arch Container Image
    # The image is only built after the tag/version check, the binaries, the
    # signed release/SBOM job and the artifact E2E verification have all
    # succeeded. publish-release then flips the staged draft to published.
    needs: [verify-tag, release-gate, build-binaries, sbom-and-release, artifact-e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # cosign keyless signature over the image digest
    env:
      # Pin the scanner by digest so the vulnerability gate cannot change
      # underneath a release.
      TRIVY_IMAGE: aquasec/trivy:0.67.0@sha256:94711c60051c6cab848a292e3a67f62623fcee361b2bb661f43b17184f4afdac
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image is assembled from the archives produced by build-binaries, so
      # no Rust compilation happens here. The archives themselves were already
      # checked by artifact-e2e before this job started.
      - name: Download all binary artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Prepare prebuilt binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prebuilt/empty
          : > prebuilt/empty/.keep
          declare -A map=( [x86_64-unknown-linux-gnu]=amd64 [aarch64-unknown-linux-gnu]=arm64 [armv7-unknown-linux-gnueabihf]=arm )
          for triple in "${!map[@]}"; do
            archive=$(find artifacts -name "sito-*-${triple}.tar.gz" -print -quit)
            if [ -z "$archive" ]; then
              echo "::error::missing archive for ${triple}"
              exit 1
            fi
            tmp=$(mktemp -d)
            tar -xzf "$archive" -C "$tmp"
            mapfile -t extracted < <(find "$tmp" -mindepth 1 -maxdepth 1 -type d -name 'sito-*')
            if [ "${#extracted[@]}" -ne 1 ]; then
              echo "::error::expected exactly one sito-* directory for ${triple}, found ${#extracted[@]}"
              exit 1
            fi
            install -D -m 0755 "${extracted[0]}/sito" "prebuilt/${map[$triple]}/sito"
            rm -rf "$tmp"
          done
          find prebuilt -maxdepth 3 -type f -print

      # No docker/setup-qemu-action: the image is assembled from prebuilt
      # target-architecture binaries, so nothing foreign is executed during the
      # build.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` and the moving `<major>.<minor>` tag are stable-only. A
          # prerelease (tag containing '-') keeps its full version tag but must
          # not move a stable tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}

      - name: Build and push multi-arch Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.release
          # The release archives extracted above form the `binaries` context;
          # Dockerfile.release copies `/${TARGETARCH}/sito` from it.
          build-contexts: binaries=./prebuilt
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Supply-chain attestations: BuildKit provenance and an SPDX SBOM
          # attestation are attached to the pushed image index. The step below
          # verifies that both are present before the job can succeed.
          provenance: true
          sbom: true

      - name: Verify the pushed image digest, platforms and attestations
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REF_NAME: ${{ github.ref_name }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          if ! printf '%s' "${DIGEST}" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::build-push-action returned an unexpected digest '${DIGEST}'"
            exit 1
          fi

          # Every tag generated by the metadata step must resolve to the digest
          # the build reported; a mismatch means another publish raced us.
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            resolved="$(docker buildx imagetools inspect "${tag}" --format '{{.Manifest.Digest}}')"
            if [ "${resolved}" != "${DIGEST}" ]; then
              echo "::error::${tag} resolves to ${resolved}, expected ${DIGEST}"
              exit 1
            fi
          done <<< "${TAGS}"

          # A stable tag must move latest to this build; a prerelease must not
          # publish or move latest at all.
          if printf '%s' "${REF_NAME}" | grep -q -- '-'; then
            if printf '%s\n' "${TAGS}" | grep -Fxq "${IMAGE}:latest"; then
              echo "::error::prerelease tag ${REF_NAME} would publish ${IMAGE}:latest"
              exit 1
            fi
            if latest="$(docker buildx imagetools inspect "${IMAGE}:latest" \
              --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
              if [ "${latest}" = "${DIGEST}" ]; then
                echo "::error::${IMAGE}:latest points at prerelease digest ${DIGEST}"
                exit 1
              fi
            fi
          else
            if ! printf '%s\n' "${TAGS}" | grep -Fxq "${IMAGE}:latest"; then
              echo "::error::stable tag ${REF_NAME} did not publish ${IMAGE}:latest"
              exit 1
            fi
            latest="$(docker buildx imagetools inspect "${IMAGE}:latest" --format '{{.Manifest.Digest}}')"
            if [ "${latest}" != "${DIGEST}" ]; then
              echo "::error::${IMAGE}:latest resolves to ${latest}, expected ${DIGEST}"
              exit 1
            fi
          fi

          # The index must contain every platform the release promises. The
          # attestation manifests appear as unknown/unknown and are ignored by
          # the explicit allowlist.
          platforms="$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" \
            --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}}{{with .Platform.Variant}}/{{.}}{{end}} {{end}}')"
          # BuildKit reports 64-bit ARM as linux/arm64/v8 while some builders
          # omit the implicit variant. The helper accepts both spellings and
          # still enforces linux/amd64, linux/arm64 and linux/arm/v7.
          if ! printf '%s\n' "${platforms}" | scripts/check-release-platforms.sh; then
            echo "::error::image ${IMAGE}@${DIGEST} is missing a required platform"
            exit 1
          fi

          # `provenance: true` and `sbom: true` must have attached attestations
          # to the pushed index; fail closed if either is missing.
          #
          # Consume the full payload in the helper.  A bare
          # `printf ... | grep -q` can make printf die with SIGPIPE when grep
          # exits early, which `pipefail` turns into a false negative after the
          # image has already been published.
          provenance="$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{json .Provenance}}')"
          if ! printf '%s' "${provenance}" | scripts/check-release-attestation.sh SLSA; then
            echo "::error::no SLSA provenance attestation on ${IMAGE}@${DIGEST}"
            exit 1
          fi
          sbom="$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{json .SBOM}}')"
          if ! printf '%s' "${sbom}" | scripts/check-release-attestation.sh SPDX; then
            echo "::error::no SPDX SBOM attestation on ${IMAGE}@${DIGEST}"
            exit 1
          fi

          echo "Verified ${IMAGE}@${DIGEST}"
          echo "platforms: ${platforms}"
          echo "tags:"
          printf '%s\n' "${TAGS}"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          # Pinned to a v2 release: the v3 CLI changed its flag surface.
          cosign-release: 'v2.6.5'

      - name: Scan the published image for vulnerabilities
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # `docker/login-action` stored the GHCR credential in the runner's
          # Docker config. Mount it read-only so Trivy can pull the digest.
          #
          # Every platform the release promises is scanned from the same
          # pushed digest, so a HIGH/CRITICAL vulnerability that only affects
          # arm64 or armv7 cannot slip past the gate. `set -e` stops at the
          # first failing platform, which fails the release job.
          platforms=(linux/amd64 linux/arm64 linux/arm/v7)
          for platform in "${platforms[@]}"; do
            echo "Scanning ${IMAGE}@${DIGEST} for ${platform}"
            docker run --rm \
              -v "${HOME}/.docker:/root/.docker:ro" \
              "${TRIVY_IMAGE}" image \
              --platform "${platform}" \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --no-progress \
              "${IMAGE}@${DIGEST}"
            echo "No HIGH/CRITICAL unfixed vulnerabilities on ${platform}"
          done

      - name: Sign and verify the image digest (cosign keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/tags/.*$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"

      - name: Smoke-test the published image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # Pin the digest so the smoke test cannot drift to a newer tag pushed
          # after the build step (and so it tests exactly what was attested).
          image="${IMAGE}@${DIGEST}"
          # Override the entrypoint: it injects `--config /etc/sito/config.toml`
          # and would otherwise duplicate/override the arguments below.
          docker run --rm --entrypoint /usr/bin/sito "${image}" --version
          docker run --rm --entrypoint /usr/bin/sito \
            -v "${PWD}/config.example.toml:/config.toml:ro" \
            "${image}" check-config --config /config.toml
          # Exercise the shipped default entrypoint with the shipped config
          # mounted at the path it expects, so the image is usable as-is.
          docker run --rm \
            -v "${PWD}/config.example.toml:/etc/sito/config.toml:ro" \
            "${image}" --version

          # Live smoke test: start the published image with a self-contained
          # config, wait for a local rewrite, and require the image healthcheck
          # to turn healthy. This runs the exact attested digest, not a rebuild.
          tmp="$(mktemp -d)"
          api_tmp="$(mktemp -d)"
          container="sito-release-smoke"
          api_container="sito-release-smoke-api"
          # The release image runs as uid/gid 65532. A host bind-mounted data
          # dir would be owned by the runner (uid 1000), and the container
          # entrypoint's post-migration ownership restore would then fail
          # without CAP_CHOWN. Use the image's declared volume instead: Docker
          # initialises it from /var/lib/sito with the image's 65532 owner.
          data_volume="sito-release-smoke-data-$$"
          api_data_volume="sito-release-smoke-api-data-$$"
          cleanup() {
            docker rm -f "${container}" "${api_container}" >/dev/null 2>&1 || true
            docker volume rm -f "${data_volume}" "${api_data_volume}" >/dev/null 2>&1 || true
            rm -rf "${tmp}" "${api_tmp}"
          }
          trap cleanup EXIT
          docker volume create "${data_volume}" >/dev/null
          mkdir -p "${tmp}/etc"
          chmod 0755 "${tmp}" "${tmp}/etc"
          cat >"${tmp}/etc/config.toml" <<'EOF'
          config_version = 2

          [server]
          role = "master"
          instance_name = "release-smoke"
          data_dir = "/var/lib/sito"
          log_level = "info"
          log_format = "json"

          [dns]
          bind = ["0.0.0.0"]
          port = 5353
          dot_port = 0
          doh_port = 0
          doq_port = 0
          doh3_port = 0

          [web]
          enabled = false

          [filtering]
          enabled = false

          [upstream]
          servers = ["1.1.1.1"]

          [[rewrites.entries]]
          domain = "smoke.test"
          type = "A"
          answer = "192.0.2.1"

          [[rewrites.entries]]
          domain = "localhost"
          type = "A"
          answer = "127.0.0.1"
          EOF
          sed -i 's/^ *//' "${tmp}/etc/config.toml"
          docker run --rm \
            -v "${tmp}/etc/config.toml:/etc/sito/config.toml:ro" \
            -v "${data_volume}:/var/lib/sito" \
            "${image}" reset-admin --password release-smoke-password >/dev/null
          docker run -d --name "${container}" \
            -p 15353:5353/udp \
            -v "${tmp}/etc/config.toml:/etc/sito/config.toml:ro" \
            -v "${data_volume}:/var/lib/sito" \
            "${image}" >/dev/null
          answered=0
          for _ in $(seq 1 40); do
            if ! docker inspect -f '{{.State.Running}}' "${container}" 2>/dev/null | grep -qx true; then
              echo "::error::release image exited before answering"
              docker logs "${container}" || true
              exit 1
            fi
            if python3 -c 'import socket,struct,sys; qname=b"\x05smoke\x04test\x00"; q=struct.pack("!HHHHHH",0x5252,0x0100,1,0,0,0)+qname+struct.pack("!HH",1,1); s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.settimeout(1.0); s.sendto(q,("127.0.0.1",15353)); d,_=s.recvfrom(4096); sys.exit(0 if struct.unpack("!H",d[:2])[0]==0x5252 and b"\xc0\x00\x02\x01" in d else 1)'
            then
              answered=1
              break
            fi
            sleep 1
          done
          [ "${answered}" = "1" ] || { echo "::error::release image did not answer smoke.test"; docker logs "${container}" || true; exit 1; }
          health="unknown"
          for _ in $(seq 1 90); do
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "${container}")"
            [ "${health}" = "healthy" ] && break
            [ "${health}" = "unhealthy" ] && { echo "::error::release image healthcheck is unhealthy"; docker logs "${container}" || true; exit 1; }
            sleep 1
          done
          [ "${health}" = "healthy" ] || { echo "::error::release image health status is ${health}"; docker logs "${container}" || true; exit 1; }
          echo "release image answered smoke.test; healthcheck: ${health}"

          # Second container, same attested digest: enable the admin web UI so
          # the 2.0 API surface is exercised. A fresh data dir plus an admin
          # account means `/api/v2/status` answers its real auth response
          # (401 without a token) instead of the setup-pending 503, and the
          # removed `/api/v1` prefix must stay unmounted (404). The container
          # also writes a fresh stats database, whose schema version is checked
          # after shutdown.
          docker volume create "${api_data_volume}" >/dev/null
          mkdir -p "${api_tmp}/etc"
          chmod 0755 "${api_tmp}" "${api_tmp}/etc"
          cat >"${api_tmp}/etc/config.toml" <<'EOF'
          config_version = 2

          [server]
          role = "master"
          instance_name = "release-smoke-api"
          data_dir = "/var/lib/sito"
          log_level = "info"
          log_format = "json"

          [dns]
          bind = ["0.0.0.0"]
          port = 5353
          dot_port = 0
          doh_port = 0
          doq_port = 0
          doh3_port = 0

          [web]
          enabled = true
          bind = "0.0.0.0"
          port = 8080

          [filtering]
          enabled = false

          [upstream]
          servers = ["1.1.1.1"]

          [[rewrites.entries]]
          domain = "smoke.test"
          type = "A"
          answer = "192.0.2.1"

          [[rewrites.entries]]
          domain = "localhost"
          type = "A"
          answer = "127.0.0.1"
          EOF
          sed -i 's/^ *//' "${api_tmp}/etc/config.toml"
          docker run --rm \
            -v "${api_tmp}/etc/config.toml:/etc/sito/config.toml:ro" \
            -v "${api_data_volume}:/var/lib/sito" \
            "${image}" reset-admin --password release-smoke-password >/dev/null
          docker run -d --name "${api_container}" \
            -p 18080:8080/tcp \
            -v "${api_tmp}/etc/config.toml:/etc/sito/config.toml:ro" \
            -v "${api_data_volume}:/var/lib/sito" \
            "${image}" >/dev/null

          api_health=""
          for _ in $(seq 1 60); do
            if ! docker inspect -f '{{.State.Running}}' "${api_container}" 2>/dev/null | grep -qx true; then
              echo "::error::release image (web enabled) exited before serving the API"
              docker logs "${api_container}" || true
              exit 1
            fi
            api_health="$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:18080/health || true)"
            [ "${api_health}" = "200" ] && break
            sleep 1
          done
          [ "${api_health}" = "200" ] || { echo "::error::release image /health returned ${api_health}"; docker logs "${api_container}" || true; exit 1; }
          curl -s --max-time 5 http://127.0.0.1:18080/health |
            grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' ||
            { echo "::error::release image /health did not report status: ok"; docker logs "${api_container}" || true; exit 1; }

          # Authentication behavior comes from the router: an anonymous
          # GET /api/v2/status is 401 once setup is complete. Accept 200 or 401
          # (the real auth response) and fail on 404, which would mean the v2
          # surface is not mounted. `/api/v1/status` was removed in 2.0.
          v2_status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:18080/api/v2/status || true)"
          case "${v2_status}" in
            200|401) ;;
            *) echo "::error::/api/v2/status returned ${v2_status}, expected 200 or 401"; docker logs "${api_container}" || true; exit 1 ;;
          esac
          v1_status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:18080/api/v1/status || true)"
          [ "${v1_status}" = "404" ] || { echo "::error::/api/v1/status returned ${v1_status}, expected 404"; docker logs "${api_container}" || true; exit 1; }

          # The web-enabled container keeps the image healthcheck honest: the
          # check now also needs the public `/health` endpoint, not just DNS.
          api_health_status="unknown"
          for _ in $(seq 1 90); do
            api_health_status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "${api_container}")"
            [ "${api_health_status}" = "healthy" ] && break
            [ "${api_health_status}" = "unhealthy" ] && { echo "::error::release image (web enabled) healthcheck is unhealthy"; docker logs "${api_container}" || true; exit 1; }
            sleep 1
          done
          [ "${api_health_status}" = "healthy" ] || { echo "::error::release image (web enabled) health status is ${api_health_status}"; docker logs "${api_container}" || true; exit 1; }

          # A fresh 2.0 install must create a schema-v2 stats database. Stop the
          # server first (the migration lease forbids a live inspection), then
          # use the shipped CLI read-only dry run on the same data dir.
          docker stop --time 30 "${api_container}" >/dev/null
          schema_out="$(docker run --rm \
            -v "${api_tmp}/etc/config.toml:/etc/sito/config.toml:ro" \
            -v "${api_data_volume}:/var/lib/sito" \
            --entrypoint /usr/bin/sito "${image}" \
            db migrate --config /etc/sito/config.toml --dry-run)"
          printf '%s\n' "${schema_out}"
          printf '%s' "${schema_out}" | grep -Eq 'already at schema version 2\b' ||
            { echo "::error::fresh release data dir is not schema v2"; docker logs "${api_container}" || true; exit 1; }
          echo "release image API smoke: /api/v2/status=${v2_status} (real auth response); /api/v1/status=404 (removed); fresh stats schema v2; healthcheck: ${api_health_status}"

  publish-release:
    name: Publish GitHub Release
    # The release is staged as a draft by sbom-and-release. Publish it only
    # after artifact E2E and the image job are green, so a failure in either
    # leaves a draft (recoverable) instead of published assets without an image.
    needs: [sbom-and-release, artifact-e2e, docker-build-push]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # flip the staged draft to a published release
    steps:
      - name: Publish the staged release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "${TAG}" in
            *-*) prerelease_tag=true ;;
            *) prerelease_tag=false ;;
          esac
          if [ "${prerelease_tag}" = "true" ]; then
            # Prerelease: keep it out of the repository's "latest" slot.
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              --draft=false --prerelease
          else
            # Stable: publish and explicitly move "latest" to this release.
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              --draft=false --latest
          fi

          is_draft="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json isDraft --jq '.isDraft')"
          if [ "${is_draft}" != "false" ]; then
            echo "::error::release ${TAG} is still a draft after publish"
            exit 1
          fi
          is_prerelease="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json isPrerelease --jq '.isPrerelease')"
          if [ "${prerelease_tag}" = "true" ]; then
            if [ "${is_prerelease}" != "true" ]; then
              echo "::error::prerelease tag ${TAG} is not marked as a prerelease"
              exit 1
            fi
          else
            latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
            if [ "${latest_tag}" != "${TAG}" ]; then
              echo "::error::stable release ${TAG} is not latest (latest is ${latest_tag})"
              exit 1
            fi
          fi
          echo "Published ${TAG} (prerelease=${is_prerelease})"
