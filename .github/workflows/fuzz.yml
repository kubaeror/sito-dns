name: Fuzz

# Coverage-guided fuzzing is deliberately NOT a pull-request gate (D14/P-7).
# Pull requests only build the targets (`ci.yml` → `fuzz-build`). This workflow
# owns the nightly smoke and the 24-hour release-checklist run.
#
# GitHub-hosted jobs are capped at 6 hours. The 24-hour checklist therefore
# runs as four parallel 6-hour shards per target (24 target-hours aggregate)
# on `ubuntu-24.04`; no self-hosted runner is required. The shard count is an
# input so the same workflow can run the short nightly smoke.
on:
  schedule:
    # Nightly smoke, offset from the weekly quality run.
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: Seconds per shard (max 21600; use 21600 with shards=4 for ~24h)
        type: string
        default: '600'
      shards:
        description: Parallel shards (1 for the nightly smoke; 4 for the 24h checklist)
        type: string
        default: '1'

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  # A scheduled smoke must not cancel a manual 24-hour release run.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  prepare:
    name: prepare fuzz matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build the target × shard matrix
        id: matrix
        env:
          INPUT_SHARDS: ${{ github.event_name == 'workflow_dispatch' && inputs.shards || '1' }}
        run: |
          set -euo pipefail
          shards="${INPUT_SHARDS:-1}"
          case "${shards}" in
            ''|*[!0-9]*)
              echo "::error::shards must be a positive integer, got '${shards}'"
              exit 1
              ;;
          esac
          if [ "${shards}" -lt 1 ] || [ "${shards}" -gt 8 ]; then
            echo "::error::shards must be between 1 and 8"
            exit 1
          fi
          matrix=$(python3 -c '
          import json, os
          shards = int(os.environ["INPUT_SHARDS"])
          targets = [
              {"target": "dns_wire", "dictionary": "fuzz/dictionaries/dns_wire.dict"},
              {"target": "abp_parser", "dictionary": "fuzz/dictionaries/abp_parser.dict"},
              {"target": "dnssec_response", "dictionary": "fuzz/dictionaries/dns_wire.dict"},
              {"target": "ha_bundle", "dictionary": "fuzz/dictionaries/ha_bundle.dict"},
              {"target": "config_toml", "dictionary": "fuzz/dictionaries/config_toml.dict"},
          ]
          print(json.dumps([dict(t, shard=i) for t in targets for i in range(shards)]))
          ')
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  fuzz:
    name: fuzz (${{ matrix.target }} shard ${{ matrix.shard }})
    needs: prepare
    # GitHub-hosted runner only; the 24h run is split into shards because
    # GitHub-hosted jobs have a 6-hour ceiling.
    runs-on: ubuntu-24.04
    # The fuzz budget is at most 6h; the job ceiling leaves a little room for
    # checkout/build/upload. A 24h checklist dispatch uses four such shards.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: nightly-2026-11-04
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: fuzz-${{ matrix.target }}
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-fuzz@0.13.2
      - name: Resolve the fuzz duration
        id: duration
        env:
          INPUT_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.fuzz_seconds || '600' }}
        run: |
          set -euo pipefail
          seconds="${INPUT_SECONDS:-600}"
          case "${seconds}" in
            ''|*[!0-9]*)
              echo "::error::fuzz_seconds must be a positive integer, got '${seconds}'"
              exit 1
              ;;
          esac
          if [ "${seconds}" -lt 30 ]; then
            echo "::error::fuzz_seconds must be at least 30"
            exit 1
          fi
          if [ "${seconds}" -gt 21600 ]; then
            echo "::error::fuzz_seconds must be <= 21600 (GitHub-hosted job ceiling); use more shards for a longer aggregate campaign"
            exit 1
          fi
          echo "seconds=${seconds}" >> "${GITHUB_OUTPUT}"
          if [ "${seconds}" -ge 19800 ]; then
            echo "::notice::this shard is part of the 24-hour release-checklist campaign"
          fi
      - name: Fuzz ${{ matrix.target }} shard ${{ matrix.shard }}
        env:
          FUZZ_SECONDS: ${{ steps.duration.outputs.seconds }}
          # `cargo fuzz` invokes its own cargo/rustc; without this the repo's
          # rust-toolchain.toml can select the runner's musl-host 1.99.1 and
          # ASan then fails on a statically linked libc.
          RUSTUP_TOOLCHAIN: nightly-2026-11-04
        run: |
          set -o pipefail
          cargo +nightly-2026-11-04 fuzz run --target x86_64-unknown-linux-gnu "${{ matrix.target }}" \
            -- -dict=${{ matrix.dictionary }} \
            -seed=${{ matrix.shard }} \
            -max_total_time="${FUZZ_SECONDS}" -timeout=10 -rss_limit_mb=4096 \
            | tee "fuzz-${{ matrix.target }}-shard${{ matrix.shard }}.log"
      - name: Upload crash artifacts and corpus
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}-shard${{ matrix.shard }}-${{ github.run_id }}
          path: |
            fuzz/artifacts/
            fuzz/corpus/
            fuzz-${{ matrix.target }}-shard${{ matrix.shard }}.log
          if-no-files-found: ignore
