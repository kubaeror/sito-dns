services:
  sito:
    build:
      context: .
      dockerfile: Dockerfile
    image: sito:local
    cap_add:
      - NET_BIND_SERVICE
    # Hardening: the container never needs to gain privileges, and the root
    # filesystem stays read-only. Writable state lives in the volumes above;
    # /tmp is a small tmpfs for transient files.
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      # LAN-only deployment: publish DNS to the interface your clients use and
      # keep 8080 on loopback (or behind a TLS reverse proxy). Docker's port
      # mapping controls *host* exposure; web.bind controls the listener
      # *inside* the container (keep it 0.0.0.0 so Docker can forward). The
      # historical mappings below are unchanged for compatibility; they expose
      # the admin UI on every host interface over plain HTTP.
      # For safe admin access, replace the 8080 line with:
      #   - "127.0.0.1:8080:8080/tcp"
      - "53:53/udp"
      - "53:53/tcp"
      - "853:853/tcp"
      - "853:853/udp"
      - "443:443/tcp"
      - "443:443/udp"
      - "8080:8080/tcp"
    volumes:
      # NOTE: the container runs as uid 65532 (distroless nonroot) and must be
      # able to write config.toml during the setup wizard:
      #   sudo chown -R 65532:65532 ./config
      # The named data volume below is initialized by the image with uid/gid
      # 65532 ownership. Only bind-mounted data directories need:
      #   sudo chown -R 65532:65532 ./data
      - "./config:/etc/sito"
      - "sito-data:/var/lib/sito"
    restart: unless-stopped
    # Give the bounded query-log shutdown flush time to finish before Docker
    # sends SIGKILL (the default stop grace period is 10 s).
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "/usr/bin/sito",
          "--config",
          "/etc/sito/config.toml",
          "healthcheck",
          "--setup-fallback",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  sito-data: {}
