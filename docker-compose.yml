services:
  sito:
    build:
      context: .
      dockerfile: Dockerfile
    image: sito:m1
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    volumes:
      - "./config:/etc/sito"
      - "sito-data:/var/lib/sito"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/bin/sito", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sito-data: {}
