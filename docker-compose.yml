services:
  sito:
    # Production default: a pinned release tag. For reproducible deploys pin
    # the digest as well (ghcr.io/kubaeror/sito-dns:1.9.5@sha256:<digest>).
    # To run a locally built image during development, layer the build override:
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ghcr.io/kubaeror/sito-dns:1.9.5
    # The image entrypoint runs the explicit `sito db migrate` path before the
    # server when /var/lib/sito/stats.db already exists, so a 1.9.x database is
    # backed up (0600 stats.db.v1.bak) and upgraded in place. For a controlled
    # upgrade where you run the migration yourself, opt out explicitly:
    #   environment:
    #     SITO_NO_MIGRATE: "1"
    # The server then fails closed on an un-migrated database (B3 policy).
    cap_add:
      - NET_BIND_SERVICE
    # Hardening: the container never needs to gain privileges, and the root
    # filesystem stays read-only. Writable state lives in the volumes below;
    # /tmp is a small tmpfs for transient files.
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      # LAN-only deployment: publish DNS to the interface your clients use and
      # keep the admin UI on loopback. Docker's port mapping controls *host*
      # exposure; web.bind controls the listener *inside* the container (keep
      # it 0.0.0.0 so Docker can forward). For remote admin access use an SSH
      # tunnel (ssh -L 8080:127.0.0.1:8080 user@server) or a TLS reverse proxy.
      - "53:53/udp"
      - "53:53/tcp"
      - "853:853/tcp"
      - "853:853/udp"
      - "443:443/tcp"
      - "443:443/udp"
      # Loopback-only admin UI: never expose plain HTTP 8080 on every host
      # interface. To reach it remotely, tunnel or reverse-proxy it.
      - "127.0.0.1:8080:8080/tcp"
    volumes:
      # Configuration lives in a named volume: the image initialises
      # /etc/sito with uid/gid 65532 (distroless nonroot), so no host chown is
      # needed. To keep config.toml on the host instead, replace this with
      #   - "./config:/etc/sito"
      # and hand the directory to the container user once:
      #   sudo chown -R 65532:65532 ./config
      - "sito-config:/etc/sito"
      # The named data volume is initialized by the image with uid/gid 65532
      # ownership. Only bind-mounted data directories need:
      #   sudo chown -R 65532:65532 ./data
      - "sito-data:/var/lib/sito"
    restart: unless-stopped
    # Give the bounded query-log shutdown flush time to finish before Docker
    # sends SIGKILL (the default stop grace period is 10 s).
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "/usr/bin/sito",
          "--config",
          "/etc/sito/config.toml",
          "healthcheck",
          "--setup-fallback",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  sito-config: {}
  sito-data: {}
