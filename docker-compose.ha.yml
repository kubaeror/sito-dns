# =============================================================================
# sito DNS - High Availability (HA) Cluster Deployment
# =============================================================================
# Architecture: Master / Slave State Machine Replication over WebSocket + mTLS
# Authoritative Plan: docs/dns-server-plan-detailed.md (Section 11 & 17.3)
# Phase Specification: docs/phases/m8-ha.md
#
# QUICK START:
# 1. Generate mTLS certificate suite and BLAKE3 pinned fingerprints:
#    sito ha gen-certs --dir ./ha/certs --master --slave
#    (--master/--slave are booleans selecting which certs to generate; omit
#    both to generate the full set. Generated certs carry only localhost /
#    sito-master / sito-slave / 127.0.0.1 / ::1 SANs, so keep the default
#    fingerprint pinning; see docs/runbook-ha.md for SAN/pinning details.)
#
# 2. Copy certificates to node directories and hand them to the container
#    runtime user (uid/gid 65532). The image is distroless nonroot: keys owned
#    by your host user are unreadable inside the container, which disables the
#    mTLS replication listener without failing the DNS healthcheck.
#    mkdir -p ha/master/certs ha/slave/certs
#    cp ha/certs/ca.crt ha/master/certs/ && cp ha/certs/ca.crt ha/slave/certs/
#    cp ha/certs/master.crt ha/certs/master.key ha/master/certs/
#    cp ha/certs/slave.crt ha/certs/slave.key ha/slave/certs/
#    sudo chown -R 65532:65532 ha/master/certs ha/slave/certs
#    sudo chmod 0600 ha/master/certs/*.key ha/slave/certs/*.key
#    (Alternatively, generate directly with `--uid 65532 --gid 65532` as root:
#    sudo sito ha gen-certs --dir ./ha/certs --master --slave --uid 65532 --gid 65532)
#
# 3. Match the LAN topology to your network. The defaults are 192.168.1.0/24
#    with master .10, slave .11, optional slave-2 .12 and parent eth0. Override
#    them in the shell or a .env file next to this file:
#      SITO_HA_PARENT=enp3s0
#      SITO_HA_SUBNET=192.168.1.0/24
#      SITO_HA_GATEWAY=192.168.1.1
#      SITO_HA_MASTER_IP=192.168.1.10
#      SITO_HA_SLAVE_IP=192.168.1.11
#      SITO_HA_SLAVE2_IP=192.168.1.12
# 4. Write each node's /etc/sito/config.toml inside the mounted directories
#    (ha/master/config, ha/slave/config). Environment overrides are NOT supported:
#    configuration comes exclusively from config.toml.
#    The mounted config directories must be writable by uid 65532 (distroless nonroot):
#      sudo chown -R 65532:65532 ha/master/config ha/slave/config
#    The named data volumes are initialized with uid/gid 65532 ownership by the
#    image; only bind-mounted data directories need the same chown.
# 5. Start the HA cluster:
#    docker compose -f docker-compose.ha.yml up -d
#
# The healthcheck below fails when [ha] is configured but replication is not
# ready (mTLS/key permissions, listener bind, initial slave handshake), so a
# healthy DNS probe can no longer mask a broken HA node. Check
# `docker inspect --format '{{json .State.Health}}' sito-master` and
# GET /api/v2/ha/status (`ready` / `readiness_reason`) for the cause.
#
# DHCP CONFIGURATION (MikroTik RouterOS Option 6):
# Configure RouterOS DHCP server to hand out both redundant DNS IPs:
#   /ip dhcp-server network set [find] dns-server=192.168.1.10,192.168.1.11
# Or using raw DHCP Option 6 (hex is the two DNS IPs in network order; this
# example is 192.168.1.10,192.168.1.11 and must have an even number of hex
# digits). Regenerate it if you change SITO_HA_MASTER_IP / SITO_HA_SLAVE_IP:
#   /ip dhcp-server option add name=ha-dns code=6 value="0xc0a8010ac0a8010b"
#   /ip dhcp-server network set [find] dhcp-option=ha-dns
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Master Node: Authoritative configuration, Web UI read/write, pushes state
  # ---------------------------------------------------------------------------
  sito-master:
    # Pinned release image; pin the digest as well for reproducible deploys.
    # The image entrypoint runs `sito db migrate` before the server when the
    # stats DB needs it. Set SITO_NO_MIGRATE=1 to skip that step and keep the
    # fail-closed startup policy for a controlled upgrade.
    image: ghcr.io/kubaeror/sito-dns:1.9.5
    container_name: sito-master
    cap_add:
      - NET_BIND_SERVICE
    # Hardening: no privilege gain, read-only root filesystem, writable state
    # only in the mounted config/data volumes plus a small /tmp tmpfs.
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      lan:
        ipv4_address: ${SITO_HA_MASTER_IP:-192.168.1.10}
    volumes:
      # Bind-mounted config must be handed to the runtime user once:
      #   sudo chown -R 65532:65532 ha/master/config ha/master/certs
      - "./ha/master/config:/etc/sito"
      - "./ha/master/certs:/etc/sito/certs:ro"
      - "sito-master-data:/var/lib/sito"
    # NOTE: configuration is read from ./ha/master/config/config.toml.
    # DNSD__* environment overrides are not implemented; see docs/runbook-ha.md.
    restart: unless-stopped
    # Give the bounded query-log shutdown flush time to finish before Docker
    # sends SIGKILL (the default stop grace period is 10 s).
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "/usr/bin/sito",
          "--config",
          "/etc/sito/config.toml",
          "healthcheck",
          "--setup-fallback",
        ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  # ---------------------------------------------------------------------------
  # Slave Node 1: Read-only Web UI, replicated state, continuous DNS resolution
  # ---------------------------------------------------------------------------
  sito-slave:
    # Pinned release image; pin the digest as well for reproducible deploys.
    image: ghcr.io/kubaeror/sito-dns:1.9.5
    container_name: sito-slave
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      lan:
        ipv4_address: ${SITO_HA_SLAVE_IP:-192.168.1.11}
    volumes:
      # Bind-mounted config must be handed to the runtime user once:
      #   sudo chown -R 65532:65532 ha/slave/config ha/slave/certs
      - "./ha/slave/config:/etc/sito"
      - "./ha/slave/certs:/etc/sito/certs:ro"
      - "sito-slave-data:/var/lib/sito"
    # NOTE: configuration is read from ./ha/slave/config/config.toml.
    restart: unless-stopped
    # Give the bounded query-log shutdown flush time to finish before Docker
    # sends SIGKILL (the default stop grace period is 10 s).
    stop_grace_period: 30s
    depends_on:
      - sito-master
    healthcheck:
      test:
        [
          "CMD",
          "/usr/bin/sito",
          "--config",
          "/etc/sito/config.toml",
          "healthcheck",
          "--setup-fallback",
        ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  # ---------------------------------------------------------------------------
  # (Optional) Remote / Offsite Slave Node 2
  # Uncomment to deploy a secondary backup slave on another IP or subnet
  # ---------------------------------------------------------------------------
  # sito-slave-2:
  #   image: ghcr.io/kubaeror/sito-dns:1.9.5
  #   container_name: sito-slave-2
  #   cap_add:
  #     - NET_BIND_SERVICE
  #   security_opt:
  #     - no-new-privileges:true
  #   read_only: true
  #   tmpfs:
  #     - /tmp:size=64m,mode=1777
  #   networks:
  #     lan:
  #       ipv4_address: ${SITO_HA_SLAVE2_IP:-192.168.1.12}
  #   volumes:
  #     - "./ha/slave2/config:/etc/sito"
  #     - "./ha/slave2/certs:/etc/sito/certs:ro"
  #     - "sito-slave2-data:/var/lib/sito"
  #   # Configure ./ha/slave2/config/config.toml (role = "slave", master_url, ...).
  #   restart: unless-stopped
  #   depends_on:
  #     - sito-master

# =============================================================================
# Networking: Macvlan driver gives each container its own dedicated LAN IP
# NOTE: If running on a host/cloud VPS without macvlan support (e.g. Docker
# Desktop), replace with standard bridge network and port mappings:
# Master: 53:53/udp, 53:53/tcp, 853:853/tcp, 443:443/tcp, 443:443/udp, 8080:8080, 8953:8953
# Slave:  53:53/udp, 53:53/tcp, 853:853/tcp, 443:443/tcp, 443:443/udp
#         (web UI is read-only; bind it to a distinct host port if needed)
# =============================================================================
networks:
  lan:
    driver: macvlan
    driver_opts:
      # Physical interface name (e.g. eth0, enp3s0, bond0).
      parent: ${SITO_HA_PARENT:-eth0}
    ipam:
      config:
        - subnet: ${SITO_HA_SUBNET:-192.168.1.0/24}
          gateway: ${SITO_HA_GATEWAY:-192.168.1.1}

volumes:
  sito-master-data: {}
  sito-slave-data: {}
  # sito-slave2-data: {}
