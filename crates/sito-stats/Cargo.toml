[package]
name = "sito-stats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Query logging, persistent SQLite storage, and Prometheus metrics for sito"

[dependencies]
blake3.workspace = true
chrono.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sito-core.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "time", "sync", "fs"] }
tracing.workspace = true
utoipa = "6.0"

[dev-dependencies]
criterion.workspace = true
prometheus-parse = "0.2.5"
tokio = { workspace = true, features = ["rt", "macros"] }

[[bench]]
name = "stats_bench"
harness = false

[[bench]]
name = "metrics_bench"
harness = false

[lints]
workspace = true
