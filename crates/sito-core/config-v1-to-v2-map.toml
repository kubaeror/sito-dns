# config-v1-to-v2-map.toml
#
# Machine-checked inventory of every configuration field in the config v2
# schema. `crates/sito-core/src/config_schema.rs` embeds this in-package file
# at compile time and uses it to:
#
#   * reject unknown keys/tables in the parser (D5);
#   * drive the v1 -> v2 migration (`sito config migrate`); and
#   * report moved/removed/dead keys.
#
# A test in `config_schema.rs` fails when this map and the serde schema
# diverge. When you add a field:
#
#   1. add the serde field to the Rust struct;
#   2. add a `[[field]]` entry below with the same dotted path;
#   3. run `cargo test -p sito-core config_schema` and fix any drift report;
#   4. document the field in `docs/configuration-reference.md`.
#
# Path syntax
# -----------
#   section.key            a plain field
#   section.key.leaf       nested table field
#   section.items[].field  array-of-tables element field
#   section.map.*.field    arbitrary map key (one segment)
#
# Status values
# -------------
#   kept        same path and meaning in v2; no migration needed
#   deprecated  accepted in v2 for one 2.0 alpha; migration rewrites it to `to`
#   removed     no longer accepted in v2; migration drops it and reports it
#   dead        parsed historically but never used; migration drops it

schema_version = 2
from_version = 1
to_version = 2

