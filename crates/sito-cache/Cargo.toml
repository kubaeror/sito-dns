[package]
name = "sito-cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "High-performance in-memory DNS cache for sito"

[dependencies]
sito-core.workspace = true
sito-proto.workspace = true
arc-swap.workspace = true
moka.workspace = true
tokio = { workspace = true, features = ["macros", "time", "sync"] }
tracing.workspace = true

[dev-dependencies]
criterion.workspace = true
hickory-proto.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }

[features]
# Test-only accessors used by cross-crate integration tests. Not enabled by
# default; release builds must use an explicit feature set without `test-hooks`
# (the release workflow and Dockerfile are checked by test-release-workflow.sh).
test-hooks = []

[[bench]]
name = "cache_bench"
harness = false

[lints]
workspace = true
