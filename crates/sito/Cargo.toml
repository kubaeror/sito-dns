[package]
name = "sito"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Self-hosted, high-performance, filtering DNS server"

[dependencies]
anyhow.workspace = true
arc-swap.workspace = true
axum.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap.workspace = true
dashmap.workspace = true
rustls.workspace = true
hickory-proto.workspace = true
notify.workspace = true
rand.workspace = true
serde_json.workspace = true
sito-api.workspace = true
sito-cache.workspace = true
sito-runtime.workspace = true
sito-clients.workspace = true
sito-core.workspace = true
sito-dnssec.workspace = true
sito-filter.workspace = true
sito-ha.workspace = true
sito-proto.workspace = true
sito-rewrites.workspace = true
sito-routeros = { workspace = true, optional = true }
sito-stats.workspace = true
sito-transport.workspace = true
sito-upstream.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "fs", "net", "io-util", "signal"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
mimalloc = { workspace = true, optional = true }

[dev-dependencies]
async-trait.workspace = true
sito-test-support.workspace = true
rcgen.workspace = true
time.workspace = true

[features]
default = []
embed-ui = ["sito-api/embed-ui"]
mimalloc = ["dep:mimalloc"]
# Optional experimental MikroTik RouterOS DHCP lease synchronization. Not part
# of the default build: `cargo build -p sito --features routeros`.
routeros = ["dep:sito-routeros", "sito-api/routeros"]

[lints]
workspace = true
