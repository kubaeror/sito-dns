[package]
name = "sito-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "REST API, OpenAPI documentation, and administration server for sito"

[dependencies]
anyhow.workspace = true
argon2 = "0.6"
arc-swap.workspace = true
axum.workspace = true
blake3.workspace = true
chrono.workspace = true
flate2.workspace = true
hex.workspace = true
rand.workspace = true
reqwest.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
sito-cache.workspace = true
sito-clients.workspace = true
sito-core.workspace = true
sito-filter.workspace = true
sito-ha.workspace = true
sito-proto.workspace = true
sito-rewrites.workspace = true
sito-stats.workspace = true
sito-upstream.workspace = true
tar.workspace = true
thiserror.workspace = true
subtle.workspace = true
tokio.workspace = true
toml.workspace = true
totp-rs = { version = "6.0", features = ["gen_secret", "qr", "otpauth"] }
tracing.workspace = true
utoipa.workspace = true
utoipa-swagger-ui = { version = "9.0", features = ["axum"] }
rust-embed = { workspace = true, optional = true }
mime_guess = { workspace = true, optional = true }
askama = { workspace = true, optional = true }

[features]
default = []
embed-ui = ["dep:rust-embed", "dep:mime_guess", "dep:askama"]

[lints]
workspace = true
