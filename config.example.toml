config_version = 1

[server]
role = "master"
instance_name = "sito-main"
data_dir = "/var/lib/sito"
log_level = "info"
log_format = "pretty"
# Require cosign-verified release signatures for in-app updates
# update_require_signature = false

[dns]
bind = ["0.0.0.0", "::"]
port = 53
dot_port = 853
doh_port = 443
# DoQ is disabled by default because its default port (853/udp) conflicts
# with DoT when bound on the same wildcard address.
doq_port = 0
# DNS-over-HTTP/3 uses UDP; 0 disables it.
doh3_port = 443
# Restrict DoH/DoH3 to one Host/SNI (empty accepts any hostname).
# doh_dedicated_hostname = "dns.example.com"
# RFC 7830/8467 padding on DoT responses.
dot_padding = false
edns_udp_size = 1232
rate_limit_per_ip = 20
max_tcp_connections = 256
# Plaintext DoH is only started on loopback unless explicitly allowed here.
allow_plaintext_doh = false

[dns.cache]
enabled = true
size_mb = 64
min_ttl = 60
max_ttl = 86400
negative_ttl_max = 3600
prefetch = false
serve_stale_hours = 0

[dns.dnssec]
# "validate"/"strict" (bogus -> SERVFAIL), "permissive"/"log_only" (log and
# clear AD) or "off".
mode = "validate"
# Validation is on by default; disable only for debugging.
validate = true
# Negative Trust Anchors: domains exempt from validation (RFC 7646).
nta = []
# Optional explicit trust anchors ("zone:algorithm:base64key"); empty uses
# the built-in root anchors.
trust_anchors = []

[upstream]
# Upstream schemes supported: tls:// (DoT), https:// (DoH), quic:// (DoQ)
# and plain host/IP (udp:// optional).
servers = ["tls://dns.quad9.net", "https://cloudflare-dns.com/dns-query"]
bootstrap = ["9.9.9.9", "149.112.112.112"]
strategy = "failover"
timeout_ms = 5000
probe_domain = "example.com"
pool_size = 4

[filtering]
enabled = true
refresh_interval_hours = 24
blocking_mode = "zero_ip"
blocking_ttl = 10
cname_cloaking = true
fail_closed = true
anti_doh_bypass = "off"
lists = []
custom_rules = [
    "0.0.0.0 ads.example.com",
    "127.0.0.1 tracker.bad.net"
]

[auth]
session_ttl_hours = 24
login_rate_limit = 5
# Persist sessions/tokens (0600 files in data_dir) across restarts.
session_persist = true
# Default API-token lifetime in days; 0 = no expiry.
token_default_ttl_days = 0

[stats]
retention_days = 90

[privacy]
anonymize_querylog = false

# Per-client identification and policies.
# Display names and `ids` are never trusted for identity by themselves; DoH
# path / DoT SNI identification requires a shared secret per entry.
# [clients]
# trust_routeros_lease_names = false
# [clients.client_id_secrets]
# "phone" = "change-me-shared-secret"
# [clients.groups.kids]
# filtering = true
# safe_search = true
# parental = true
# [[clients.entries]]
# name = "phone"
# ids = ["192.168.1.20"]
# group = "kids"

# Local DNS rewrites (TTL applies to synthesized records).
# [rewrites]
# ttl = 60

# High availability (slave role connects to the master over mTLS WebSocket).
# [ha]
# replication_port = 8953
# listen_addr = "0.0.0.0"
# master_url = "wss://192.168.1.10:8953"
# master_fingerprint = "blake3:..."
# master_pubkey = "<ed25519 hex>"   # required on slaves
# cert = "/etc/sito/ha.crt"
# key = "/etc/sito/ha.key"
# ca = "/etc/sito/ha-ca.crt"
# pinned_slave_fingerprints = ["blake3:..."]  # or configure ca
# ping_interval_secs = 15
# stats_interval_secs = 30
# slave_token = "change-me"          # required for plaintext ws:// only
# allow_insecure_ws = false          # plaintext ws:// (token still required)
# allow_unpinned_tls = false         # accept any server cert (testing only)

# Curated parental/service list updates (bundled data is the fallback).
# [integrations.lists]
# refresh_hours = 24
# [integrations.lists.categories.adult]
# url = "https://lists.example.com/adult.txt"
# license = "CC0-1.0"
# [integrations.lists.categories.services]
# url = "https://lists.example.com/services.json"

# RouterOS DHCP lease discovery for client identification.
# [integrations.mikrotik]
# enabled = false
# url = "https://192.168.1.1"
# username = "api"
# password_env = "MIKROTIK_PASSWORD"
# interval_s = 300

[web]
enabled = true
bind = "0.0.0.0"
port = 8080
metrics_auth = true
# When binding non-loopback over plain HTTP the admin interface is reachable
# without transport encryption; use a TLS reverse proxy or [tls] in production.
trusted_proxies = []
