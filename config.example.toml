# sito config v2 (frozen at 2.0.0-alpha.1). A v1 document must be migrated:
#   sito config migrate --from v1 --to v2 --backup
# Unknown keys are rejected. See docs/config-v2.md.
config_version = 2

[server]
role = "master"
instance_name = "sito-main"
data_dir = "/var/lib/sito"
log_level = "info"
log_format = "json"
# Require cosign-verified release signatures for in-app updates (default true)
# update_require_signature = true

[dns]
# Security: this wildcard default accepts DNS queries from every source that
# can reach the host, and 2.0 has no DNS client allow-list. Restrict the DNS
# ports to your LAN with a host firewall, or bind specific LAN addresses.
# A default-deny DNS client ACL is not part of the Phase 1 config work package.
bind = ["0.0.0.0", "::"]
port = 53
dot_port = 853
doh_port = 443
# DoQ is disabled by default because its default port (853/udp) conflicts
# with DoT when bound on the same wildcard address.
doq_port = 0
# DNS-over-HTTP/3 uses UDP; 0 disables it.
doh3_port = 443
# Restrict DoH/DoH3 to one Host/SNI (empty accepts any hostname).
# doh_dedicated_hostname = "dns.example.com"
# RFC 7830/8467 padding on DoT responses.
dot_padding = false
edns_udp_size = 1232
rate_limit_per_ip = 20
max_tcp_connections = 256
# Plaintext DoH is only started on loopback unless explicitly allowed here.
allow_plaintext_doh = false

[dns.cache]
enabled = true
size_mb = 64
min_ttl = 60
max_ttl = 86400
negative_ttl_max = 3600
prefetch = true
serve_stale_hours = 12

[dns.dnssec]
# "validate"/"strict" (bogus -> SERVFAIL), "permissive"/"log_only" (log and
# clear AD) or "off".
mode = "validate"
# Validation is on by default; disable only for debugging.
validate = true
# Negative Trust Anchors: domains exempt from validation (RFC 7646).
nta = []
# Optional explicit trust anchors ("zone:algorithm:base64key"); empty uses
# the built-in root anchors.
trust_anchors = []

# Encrypted DNS certificates. [dns.tls] is a deprecated v1 alias; migrate it to
# [tls] (`sito config migrate --from v1 --to v2 --backup`).
# [tls]
# cert = "/etc/sito/cert.pem"
# key = "/etc/sito/key.pem"

# Automated certificates. The legacy [web] acme_* keys are deprecated aliases
# for one 2.0 alpha; use this typed section for new deployments.
# [acme]
# enabled = false
# email = "admin@example.com"
# domains = ["dns.example.com"]
# staging = false
# allow_bootstrap_cert = false

[upstream]
# Upstream schemes supported: tls:// (DoT), https:// (DoH), quic:// (DoQ)
# and plain host/IP (udp:// optional).
servers = ["tls://dns.quad9.net", "https://cloudflare-dns.com/dns-query"]
bootstrap = ["9.9.9.9", "149.112.112.112"]
strategy = "failover"
timeout_ms = 5000
probe_domain = "example.com"
pool_size = 4
# Hostname-configured upstreams may not resolve to private/reserved addresses
# unless this is true. IP literals are always accepted.
allow_private_targets = false

[filtering]
enabled = true
refresh_interval_hours = 24
blocking_mode = "zero_ip"
blocking_ttl = 10
cname_cloaking = true
fail_closed = true
anti_doh_bypass = "off"
# Optional wall-clock budget for compiling regex/wildcard rules. A reload that
# exceeds it aborts and keeps the previous snapshot. Unset = no budget; 0 is
# rejected.
# regex_compile_budget_ms = 250
# Per-list download cap in bytes (default 64 MiB), enforced before buffering.
# Lowering it invalidates larger cached lists. After a restart (or when no
# previous snapshot exists), an invalidated larger cache with fail_closed = true
# and no network answers SERVFAIL until a fetch under the new cap succeeds; a
# live reload keeps the previous snapshot and records the list in failed_lists.
max_list_bytes = 67108864
# Reject (default) an empty list body or a list that parses to zero rules,
# keeping the previous snapshot and marking the list failed. Set to true only
# for sources that legitimately return an empty list; false keeps filtering
# fail-closed against a broken/hostile source.
allow_empty_list = false
lists = []
custom_rules = [
    "0.0.0.0 ads.example.com",
    "127.0.0.1 tracker.bad.net"
]

[auth]
session_ttl_hours = 24
login_rate_limit = 5
# Persist sessions/tokens (0600 files in data_dir) across restarts.
session_persist = true
# Default API-token lifetime in days; 0 = no expiry. 90 keeps credentials from
# living forever by omission.
token_default_ttl_days = 90

[stats]
retention_days = 90
# Hourly rollups keep aggregate totals and top domains; client IPs are stored
# as keyed BLAKE3 hashes and names are omitted unless explicitly enabled.
rollup_retention_days = 365
rollup_client_names = false

[privacy]
anonymize_querylog = false

# Per-client identification and policies.
# Display names and `ids` are never trusted for identity by themselves; DoH
# path / DoT SNI identification requires a shared secret per entry.
# [clients]
# trust_routeros_lease_names = false
# [clients.client_id_secrets]
# "phone" = "change-me-shared-secret"
# [clients.groups.kids]
# filtering = true
# safe_search = true
# parental = true
# [[clients.entries]]
# name = "phone"
# ids = ["192.168.1.20"]
# group = "kids"

# Local DNS rewrites (TTL applies to synthesized records).
# [rewrites]
# ttl = 60

# High availability (slave role connects to the master over mTLS WebSocket).
# [ha]
# replication_port = 8953
# listen_addr = "0.0.0.0"
# master_url = "wss://192.168.1.10:8953"
# master_fingerprint = "blake3:..."
# master_pubkey = "<ed25519 hex>"   # required on slaves
# cert = "/etc/sito/ha.crt"
# key = "/etc/sito/ha.key"
# ca = "/etc/sito/ha-ca.crt"
# pinned_slave_fingerprints = ["blake3:..."]  # or configure ca
# ping_interval_secs = 15
# stats_interval_secs = 30
# slave_token = "change-me"          # required for plaintext ws:// only
# allow_insecure_ws = false          # plaintext ws:// (token still required)
# allow_unpinned_tls = false         # accept any server cert (testing only)

# Curated parental/service list updates (bundled data is the fallback).
# [integrations.lists]
# refresh_hours = 24
# [integrations.lists.categories.adult]
# url = "https://lists.example.com/adult.txt"
# license = "CC0-1.0"
# [integrations.lists.categories.services]
# url = "https://lists.example.com/services.json"

# RouterOS DHCP lease discovery for client identification.
# Optional and experimental: not compiled into the default binary. Build with
# `cargo build -p sito --features routeros`; enabling it in a build without
# that feature fails startup instead of silently ignoring the setting.
# [integrations.mikrotik]
# enabled = false
# url = "https://192.168.1.1"
# username = "api"
# password_env = "MIKROTIK_PASSWORD"
# interval_s = 300

[web]
# Security: the admin UI is plain HTTP. Keep the 2.0 loopback default behind an
# SSH tunnel or a TLS reverse proxy; the DNS [tls] certificate never secures
# the admin scheme. Binding a wildcard address without declaring a reverse
# proxy triggers a startup network-exposure warning.
enabled = true
bind = "127.0.0.1"
port = 8080
metrics_auth = true
# When binding non-loopback over plain HTTP the admin interface is reachable
# without transport encryption; use an SSH tunnel or a TLS reverse proxy. The
# DNS [tls] certificate never secures the admin scheme.
trusted_proxies = []
# The admin UI is served over plain HTTP by axum; TLS is terminated either by
# an explicit public URL or by a reverse proxy. The DNS [tls] certificate only
# secures DoT/DoH and never the admin scheme.
#
# Explicit external URL of the admin UI (scheme decides Secure cookies/HSTS):
# public_url = "https://dns.example.com"
#
# Set when a trusted reverse proxy terminates TLS in front of this server:
# tls_terminated_by_proxy = false
