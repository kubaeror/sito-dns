[package]
name = "sito-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sito-core = { path = "../crates/sito-core" }
sito-filter = { path = "../crates/sito-filter" }
sito-proto = { path = "../crates/sito-proto" }
sito-clients = { path = "../crates/sito-clients" }

[[bin]]
name = "fuzz_abp_parser"
path = "fuzz_targets/fuzz_abp_parser.rs"
test = false
doc = false

[[bin]]
name = "fuzz_toml_config"
path = "fuzz_targets/fuzz_toml_config.rs"
test = false
doc = false

[[bin]]
name = "fuzz_client_id"
path = "fuzz_targets/fuzz_client_id.rs"
test = false
doc = false

[[bin]]
name = "fuzz_dns_wire"
path = "fuzz_targets/fuzz_dns_wire.rs"
test = false
doc = false
